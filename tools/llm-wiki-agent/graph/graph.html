    "id": "sources/memory-lifecycle",
    "label": "记忆的治理:从档案库到策略(Agent Memory: From Archive to Policy)",
    "type": "source",
    "color": "#00BCD4",
    "path": "wiki\\sources\\memory-lifecycle.md",
    "markdown": "---\ntitle: \"记忆的治理:从档案库到策略(Agent Memory: From Archive to Policy)\"\ntype: source\ntags: [concept-learning, agent-memory, memory-governance, memory-lifecycle, memory-poisoning, learned-policy, silent-madman]\ndate: 2026-10-06\nsource_file: raw/learning-materials/memory-lifecycle.html\nsources: [memory-lifecycle]\nlast_updated: 2026-10-09\n---\n\n## Summary\nA concept-learning HTML document (7-section format) generated by the silent-madman concept-explainer skill on **2026-10-06**, merging four backlogged concept-radar threads into one page — **记忆生命周期 / 遗忘**, **记忆调用时机 (recall timing)**, **记忆完整性 / 持久污染**, and **记忆策略的学习化**. Its core move is to stop treating memory as *a store* and treat it as **four actions that each fail differently** — Capture → Update → Recall → QA — plus one governance question that every design must answer explicitly: **who decides what to write, when to retrieve, and when to delete.**\n\nIts thesis sentence: a memory system with no owner does not stay ownerless — **the decision power flows to whoever wants to exploit it**. The page therefore runs a single spine from *hygiene* (the four actions and their benchmarks) through *decision rights* (human rules → trained policy → attacker) to *four governance bottom lines* (auditable / rollbackable / permissioned / signature-verified), at which point the reliability discipline and the security discipline **merge at the memory layer**.\n\n**Ingest note:** executed **2026-10-09** under **explicit user instruction** (“结清 5 条”), closing the five `🟡` backlog rows that this single material had been holding (09-18 memory poisoning, 09-21 recall-timing policy, 09-24 memory lifecycle governance, 09-29 memory integrity, 09-30 memory as a learned policy). Per README's 人工核查承诺 this is an **instruction-authorised ingest**, not line-by-line manual review, and is labelled as such here, in `wiki/log.md` and in the README manifest. This source also **retires the `pending ingest` banner** on [[LongTermMemory]], which had explicitly asked to be cleared by exactly this ingest.\n\n## Key Claims\n- **Memory is four actions, not one repository.** DyadMem splits long-term memory into **Capture** (write new memories from this session) → **Update** (reconcile with the existing bank) → **Recall** (select entries still valid) → **QA** (answer from evidence), and places **gold annotations at every stage** (3,065 episodes / 50,961 sessions / 61,210 QA, spanning 16 open-weight + 4 closed models). Why it matters: an end-to-end QA score **stirs four different qualities together** — a correct answer can come from a broken bank (lucky), and a wrong answer cannot be localised. *Only measuring them separately tells you what to repair.*\n- **Every action has a quantified failure mode.** Capture: DyadMem measures **systematically low capture recall** for frontier models, plus incomplete recall and unsafe deletion; it also makes explicit **URAM** (same user, *different agents should remember different things*). Update: **Memora** (ACL 2026 Findings, arXiv:2604.20006, ASU/Genies/U. Arizona) introduces **FAMA**, a forgetting-aware metric that **penalises reliance on deleted or superseded memories** — four LLMs and six memory agents are found to “frequently reuse invalid memories and struggle to reconcile evolving memories”, with the memory module delivering only **marginal** gains; meanwhile **94% / 85%** of questions in pre-existing benchmarks span at most 2 sessions. Supporting evidence: **Memory Is a Derivation** (arXiv:2609.36130) audits compressed memories — restoring the fuller pre-write history recovers support for roughly **60%** of apparently unsupported memories, but **17–21% remain unsupported**, and **composed memories can assert relations history never established**. **MemoryAgentBench** (arXiv:2507.05257) lists **selective forgetting** alongside precise retrieval, test-time learning and long-range understanding as one of four memory capabilities; **PATH-Bench** (arXiv:2608.01149) defines **forward/backward forgetting transfer (FWT/BWT/FGT)** and concludes **“strong transfer does not guarantee retention.”** Net effect: **“failed to forget” becomes a deductible score, not rhetoric** (FAMA = recall score − stale-dependency penalty).\n- **The load-bearing variable is *who decides*** — and there are exactly three classes of decider:\n  | Decider | What gets written / retrieved / deleted | Representative evidence | Core weakness |\n  |---|---|---|---|\n  | **Human-written rules** (today's default) | Engineer hard-codes importance thresholds, TTL, extraction counts, similarity top-k | Layered memory (resident core + external retrieval + explicit forgetting policy) is the 2026 production form | Rules have no judgement about *what counts as stale*; every new domain needs re-tuning |\n  | **Trained policy** (2026's new answer) | ADD / UPDATE / DELETE / NOOP are placed **in the action space** and trained jointly by RL on task-success reward | **Memory-R1** (arXiv:2508.19828, ACL 2026 main long paper `2026.acl-long.583`): dual-agent architecture, only **152 QA pairs** to train, **LoCoMo F1 +68.9% vs Mem0**; **ATMem** (arXiv:2606.31612): cost-aware memory reward + STR-GRPO, ATMem-UI-8B reaches **76.6% on AndroidWorld** vs UI-TARS-2-230B's **73.3%** at ≈**1/29** the parameters; same family — ICML arXiv:2609.17088, UI-Mem (arXiv:2602.05832), MemChain (arXiv:2607.24097), MMPO (arXiv:2605.30159) | **All six systems remain undeployed in production**; benchmarks exclude distribution shift and adversarial input; no single system yet owns write + retrieval + transformation |\n  | **Attacker** (the decider nobody wants) | Write timing and content decided by the injector | **PMPA** (arXiv:2609.13889, Auckland/Fudan, 2026-09-12): malicious instructions embedded in *benign* sources induce harness agents to **write them into durable memory themselves** — OpenClaw ISR/C-ASR **73.7% / 55.5%**, **Claude Code 66.9% / 81.7%**, with **benign-task performance unchanged**; **Darktrace** (Eric Rozon, published 2026-09-24, disclosed 2026-08-18 to Anthropic/OpenAI/AWS): **all four harnesses (Claude Code / Codex / Kiro-CLI / Pi) accept forged conversation history**; under Kiro-CLI the attack reaches **Active Directory domain takeover** | **The fix sits on the vendor side** (message signing + server-side validation) ⇒ the defending operator **cannot deploy it** |\n- **Durable state is the difference between a session and a system.** Memory has a property a single-turn conversation does not: **errors compound**. A wrong answer this turn is forgotten next window; a wrong memory becomes a *fixed input to every future plan*. The page's sharpest inversion: the danger is not that the agent forgets — it is that it confidently treats a **three-month-superseded fact as current**.\n- **Four governance bottom lines: auditable · rollbackable · permissioned · signature-verified.** Every write / supersede / delete should be as traceable as a git commit (who, when, on what source — the entry discipline of [[Provenance]]); deletion must be a real, recorded, provable operation with a rollback path, not an invisible manual sweep; **who may write to shared memory** must be managed as explicitly as database permissions; and against the Darktrace class the only root fix is **cryptographically signed model replies validated server-side on every turn** — until then the local session-history store must be treated as a **security-sensitive file**, and *any write to it by a non-harness process is an unambiguous attack signal*.\n- **Where this page draws its boundaries.** ① **Not “a bigger context window”** — window is capacity, governance is structure and discipline; DyadMem's own numbers are the counter-evidence (Gold-Memory strong ⇒ **Full-Pipeline collapse**) ⇒ *the bottleneck is not whether it fits, but the quality of the four actions.* ② **Not [[Compaction]]** — compaction governs how **this turn's** in-window history is cut; this page governs how the **out-of-window** bank across sessions is written, revised and deleted (adjacent, and anything compaction drops that still matters should land in long-term memory rather than evaporate). ③ **Not a duplicate of [[Provenance]] / [[CitationLock]] / [[Abstention]]** — those govern the **entry and exit discipline** (writes carry origin; cite only what was opened; abstain without sourced evidence); this page governs **the whole lifecycle in between** — update, forgetting, and decision-rights. *A clean entry does not imply a clean lifecycle:* PMPA's payload arrives **inside a benign document that carries legitimate provenance**.\n- **Forgetting is a capability, not a failure.** FAMA counts “reusing deleted information” as a deduction; a system that never forgets scores perfectly on old recall-only benchmarks and is a disaster area on governance benchmarks. Symmetrically, **unsafe deletion** (removing a fact still under reference) must also be measured — DyadMem quantifies **both ends**.\n\n## Key Quotes\n> “智能体记忆的治理,是把记忆从\"一个只会增长的档案库\"改造成\"一套有人拍板、可审计、可遗忘的决策系统\"。”\n\n> “记忆不是一个仓库,而是四个会各自出错的动作(写/改/取/删)加上一个必须有人回答的问题——**这些决定由谁做**;治理就是让每个动作可审计、可回滚、有主人,因为放任不管的时候,决定权不会空缺,它会流向想利用你的人。”\n\n> “前两行是工程选型问题,第三行是安全底线——**如果记忆没有主人,主人位置不会空缺**。”\n\n> “不是模型不会用记忆,是\"记忆的四个动作\"各自都有洞。”\n\n## Connections\n- [[MemoryGovernance]] — the concept page this source primarily informs (four actions · four bottom lines · three deciders)\n- [[MemoryPoisoning]] — the write-side attack surface this source supplies: a **decider class**, not merely a failure mode\n- [[LongTermMemory]] — the page whose **second half** (decay, merge, TTL, compliant deletion) this source finally supplies; it also **clears that page's `pending ingest` banner**\n- [[Provenance]] · [[CitationLock]] · [[Abstention]] — adjacent, not overlapping: **entry/exit discipline** vs **whole-lifecycle discipline**; `ABSTAIN on incomplete recall` is this page's reuse of [[Abstention]]\n- [[Compaction]] — in-window, per-turn, lossy vs out-of-window, cross-session, offline\n- [[LLMContext]] — the bounded working set that governance sits behind\n- [[ContextEngineering]] — decides what belongs in the window each step; this source decides what survives *between* steps\n- [[DyadMem]] — the staged benchmark that makes the four actions separately measurable\n- [[LongMemEval]] — the **end-to-end QA evaluation generation** (five memory abilities) that DyadMem and Memora were built to correct\n- [[MemGPT]] — the founding “context as memory, paging via tool calls” analogy; this page's stance is that **virtual memory without lifecycle governance only scales bad state gracefully**\n- [[AgentZeroMemory]] · [[Zep]] — systems whose stored-fact discipline this page extends with forgetting + decision-rights\n- [[AgentSandbox]] — the other half of the security story: containment bounds *what it can touch*; governance bounds *what it will remember*\n- [[Agent]] — memory writes/reads are initiated by the agent loop\n\n## Contradictions\n- **Sharpens, and partially pushes back on, [[LongTermMemory]]'s headline evidence.** That page records “[[AgentZeroMemory]] 95.60% on [[LongMemEval]]” — a **Gold-Memory / end-to-end** style result. DyadMem's finding is that frontier models are strong **given gold memory** but collapse once they must run the **full pipeline** themselves; Memora separately reports that memory modules deliver only **marginal** gains and that 94%/85% of existing benchmark questions span ≤2 sessions. Not a factual conflict — a **change of measurement target** — but the wiki should stop quoting a single benchmark number as evidence that memory systems work. Recorded rather than silently merged.\n- **Internal numbers caution (self-reported).** Memory-R1's +68.9%, ATMem's 76.6%, PMPA's 73.7%/55.5% and 66.9%/81.7% are all **author-reported**; none has independent replication. The six learned-policy systems are **all undeployed** — the direction is demonstrated, not the product.\n- **Provenance grade differs across the source's own citation list** and the material states this: items 1, 2, 7, 13 (and 3) were returned and checked by live retrieval on 2026-10-06; items 4, 5, 6, 8, 9 were checked during the 2026-09-24 → 09-30 radar cycles and their arXiv IDs are **carried over** from those reports rather than re-opened here; the Darktrace item is a **secondhand report** (tech.yahoo.com) of a first-party disclosure. Treat the whole list as one grade weaker than a page whose every citation was opened on the ingest day.\n- **House-keeping discrepancy (recorded, not resolved):** the material's title and footer describe a **four-thread** merge (“生命周期 + 调用时机 + 完整性 + 学习化策略”) while the ledger booked **five** rows into it (the fifth being 09-18 memory poisoning). Both are true — poisoning enters as the *third decider* rather than as a fourth standalone section — but the wiki records the mismatch rather than flattening it.\n- **No contradiction detected** against Clusters A–E of [[overview]]: this source extends the entity-side cluster at the seam it had already named (*memory errors compound* · *the governance side of shared memory remains open*).\n",

    "markdown": "---\ntitle: \"多智能体协作的工程化(Multi-Agent Orchestration)\"\ntype: source\ntags: [concept-learning, multi-agent, test-time-communication, orchestration, claude-code-projects, agensh, silent-madman]\ndate: 2026-09-26\nsource_file: raw/learning-materials/multi-agent.html\nsources: [multi-agent]\nlast_updated: 2026-09-26\n---\n\n## Summary\nA concept-learning HTML document (7-section format) generated by the silent-madman concept-explainer skill on 2026-09-26, from the same day's concept-radar third pick — the only genuinely **new** candidate of that batch and the wiki's first coverage of anything *between* agents. Defines multi-agent orchestration as multiple agents with independent context windows working on one goal, exchanging **verified** partial results and failure paths through a shared workspace — beating best-of-k independent sampling at equal-or-less compute, **provided a verifier exists**. The material's teaching spine is the counter-result: *fails without verifier or low compute* — communication needs verifiable progress as its anchor, otherwise the shared workspace degrades into cross-contamination.\n**Ingest note:** executed 2026-09-26 under **explicit user instruction** (\"继续做\") continuing the same-day authorised chain. **Evidence grade honestly lower than the harness/sandbox materials**: the experimental numbers come from AlphaSignal's report of the paper (secondhand; arXiv abstract not opened), Agensh figures are secondhand, and Claude Code Projects' shared memory has \"no detailed performance evaluation\" per the original report.\n\n## Key Claims\n- **team@k vs best@k (the headline result).** k *communicating* agents vs the best of k *independent* samples. **ARC-AGI-3**: team@3 matches best@13, team@5 matches best@33 (≈4.3× / 6.6× equivalent independent compute). **LP85**: 64 independent attempts all failed; team@5 solved 65%. **FT09**: team@3 ≈ 26% → 90%. **polyomino packing**: team@3 set SOTA 0.945 (prev 0.894). **MNIST compression**: a 4-agent team produced a 1,957-byte classifier at 99.4% accuracy — 20% smaller than the human best.\n- **The mechanism is verified-progress sharing, not roles.** No preset roles, no central orchestrator; k agents with the same goal and compute budget exchange partial results, failure paths and code through a shared workspace. The gain comes entirely from **building on confirmed breakthroughs** — and from not re-walking confirmed dead ends.\n- **⚠️ The counter-result is the point:** the method \"**fails without verifier or low compute**\". With no cheap way to judge whose progress is real, or when compute is too tight to wait for verification, communication overhead exceeds its gains and **independent agents do better**. \"Should I go multi-agent\" is therefore an engineering predicate: *first ask whether the task has a verifier.*\n- **New failure surface: cross-contamination (互相污染).** An unverified conclusion from one agent can be inherited as a premise by the others — a failure mode that does not exist in the single-agent world and that lands exactly on [[Provenance]]'s extension line: in a team, trust must cover not just fact origin but the **verification status of peers' conclusions**. Shared memory should be treated as inspectable working context, not a source of truth.\n- **Productised: Claude Code Projects (beta 2026-09-17).** One coordinator session splits a goal into parallel threads; each thread is a full independent cloud Claude Code session with its own branch and repo copy, able to run tests, open PRs and spawn its own subagents; threads share project memory and a corpus; overlapping edits are handled as **ordinary merge conflicts, not silent merges**. Honest self-declared limits: threads **each consume subscription quota** (parallelism is not free); launch-phase threads run **only on Anthropic's cloud**; shared memory is \"inspectable working context, not authoritative source of truth\"; **CI / tests / human review remain the integration boundary** even when the coordinator reports all threads complete. Coordinator runs Opus high-effort; <200 threads/day no fixed cap; concurrency preferences are preferences, not enforcement.\n- **Decentralised scale: Agensh (Microsoft Research, Furu Wei team).** Removes the central-orchestrator bottleneck via shared workspace + message interface + shared context of reusable discoveries; scaled 1 → **1,024 agents** on pandoc, pass rate 33.89% → 55.06%; ProgramBench hardest five 19.31% → 28.78% (1 → 128 agents). Secondhand figures — direction and magnitude only.\n- **Boundaries:** vs subagents (peer team vs threads *inside* one agent — Claude Projects nests both); vs shared memory (space dimension vs time dimension); vs [[ContextEngineering]] (what to exchange *between* windows vs what to place *within* one); multi-agent is a **productised harness capability** (OpenAI: a flag + `max_concurrent_subagents`) but as a concept has its own trade-off logic.\n\n## Key Quotes\n> \"k 个通气的 agent 能追平几十个单干的——但「通气」只在有验证器时才值钱:先找到便宜的判定对错的方法,再组队;没有它,共享白板就是谣言板。\"\n\n> \"收益全部来自「建立在别人已确认的进展之上」——这不是分工(没有预设角色),也不是中央调度(没有指挥官),就是一张共享的白板。\"\n\n> \"一个人的错误结论被其他人当作已验证的前提继承下去。这就是多智能体独有的新失效面:互相污染。\"\n\n## Connections\n- [[MultiAgent]] — the concept page this source primarily informs\n- [[Compaction]] — its \"subagent with a clean window returning 1–2k high-density tokens\" note is the single-agent seed of this page's cross-window exchange; this source promotes it from footnote to mainline\n- [[Provenance]] — extended by the new failure surface: in a team, verification status of peers' conclusions matters as much as fact origin\n- [[AgentHarness]] — multi-agent is a productised harness capability (subagent scheduling is duty ④); the orchestration decision (team vs single) sits above it\n- [[Agent]] — the wiki's pages to date describe one agent; this is the first page about what happens *between* them\n- [[ContextEngineering]] — intra-window placement vs inter-window exchange; the multi-agent question is its cross-window extension\n- [[Anthropic]] — Claude Code Projects productises the coordinator pattern\n- [[OpenAI]] — subagents via a flag + `max_concurrent_subagents` on the Agents API\n\n## Contradictions\n- **None detected** against existing wiki pages. This source *fills* a structural blank: all 39 pre-existing wiki pages and both connection diagrams describe a single agent.\n- **⚠️ Evidence-grade caution (recorded in the material and here):** the team@k numbers trace to AlphaSignal's report of a Microsoft Research + UC Berkeley paper (paper entity and repo `github.com/jerryjonghopark/test-time-communication` given; **arXiv abstract page not opened**); Agensh figures are secondhand; Claude Code Projects' shared memory has \"no detailed performance evaluation\". All three are **direction-and-magnitude grade**, not first-hand. Citing verbatim requires opening the primary sources first — flagged in the radar report and in this page for follow-up.\n",

    "markdown": "---\ntitle: \"Skill(技能)\"\ntype: source\ntags: [concept-learning, anthropic, skill, progressive-disclosure, silent-madman]\ndate: 2026-09-05\nsource_file: raw/learning-materials/skill.html\nsources: [skill]\nlast_updated: 2026-09-17\n---\n\n## Summary\nA concept-learning HTML document generated by silent-madman's concept-explainer skill on 2026-09-05. Defines Skill as an organized folder of instructions, scripts, and resources that Claude loads on demand when a task is relevant — turning a general model into a domain expert. The core mechanism is *progressive disclosure* (YAML metadata → SKILL.md body → referenced scripts/assets), which fits unlimited expertise into a bounded context window.\n\n## Key Claims\n- Skill is not a prompt template — it is a cross-conversation, version-controlled, multi-product-shared directory.\n- Three-layer progressive disclosure: (1) YAML metadata always in system prompt, (2) SKILL.md body loaded when relevant, (3) scripts/assets loaded on demand.\n- Same Skill folder works across Claude app, Claude Code, API, Agent SDK; released as an open standard after 2025-12.\n- Skill is *not* MCP: Skill teaches the model how to use tools; MCP standardizes the tool connection itself.\n\n## Key Quotes\n> \"Skill 不是『让模型变聪明』,而是『把组织经验打包成可按需加载的目录』,用渐进式披露在有限的上下文里装下无限的专业知识。\"\n\n## Connections\n- [[Anthropic]] — Skill is an Anthropic product feature\n- [[Skill]] — concept page this source primarily informs\n- [[ProgressiveDisclosure]] — the load-on-demand mechanism that makes Skills work\n- [[LLMContext]] — Skills operate within bounded context via progressive disclosure\n- [[Agent]] — Skill is the unit that empowers Agents\n- [[MCP]] — complementary tool-connection standard\n- [[BaiduBaike]] — Chinese-language encyclopedia cited in the source for context-window/Skill basics\n\n## Contradictions\n- None detected at ingest time.",

    "markdown": "---\ntitle: \"工具幻觉与封闭世界消解(Tool Hallucination & Closed-World Resolution)\"\ntype: source\ntags: [concept-learning, tool-hallucination, closed-world, mcp, arxiv, silent-madman]\ndate: 2026-09-22\nsource_file: raw/learning-materials/tool-hallucination.html\nsources: [tool-hallucination]\nlast_updated: 2026-09-24\n---\n\n## Summary\nA concept-learning HTML document (7-section format) generated by the silent-madman concept-explainer skill on 2026-09-22 — the third of three \"actor-side\" materials. Defines **tool hallucination** as an agent invoking a tool that does not exist in the registry, or passing arguments no schema ever declared — and argues that because such a call is **structurally not a decision any gate ever made**, it must be caught by a closed-world resolution step placed **before** every permission gate. Primary source: arXiv:2609.19425v1 (2026-09-16).\n\n## Key Claims\n- **Tool hallucination ≠ tool selection.** Tool selection asks *which of the real tools should I use*; tool hallucination asks *does the tool I just named exist at all*. Selection methods all presuppose \"the call targets a real tool\", which is precisely the premise hallucination breaks.\n- **Permission gates cannot catch it — structurally, not for lack of rigour.** A gate's judgement domain is *the set of tools it exposed*. A hallucinated tool name is by definition outside that set, so the call never becomes a gate decision and the gate never gets the chance to refuse it. **The failure is a structural blind spot, not a tuning problem.**\n- **The fix is a dumb, early fact-check: a Resolution Rung.** Before dispatching any call, two training-free checks: ① is the tool name a member of a **closed registry**; ② does its contract signature match the trusted source. Only then do permission gates, least privilege and audit run. The paper's framing is that its value is **in its position, not its algorithm** — it must sit upstream of every causal gate.\n- **Measured, not hypothetical: 322 real hallucinations** captured across **10 hosted models** and **two invocation surfaces**; **154** further hallucinations on a real MCP surface after tools were merged.\n- **Scale does not buy immunity — the most counter-intuitive finding.** A **675B**-parameter model behaves comparably to a **7–8B** model on this failure. \"The next bigger model will grow out of it\" is not a viable roadmap; the correct move is an architectural fact-check layer, not another model upgrade.\n- **Interface freedom amplifies the hallucination space.** Fabricated tool names concentrate on the most permissive invocation surface (free-form JSON parsed as a tool call) versus a schema-constrained one. Constraining the surface **lowers probability but does not reach zero** — so constraint and the upstream rung are both required.\n- **Merging MCP servers *adds* a new hallucination surface.** When several MCP servers are combined into one namespace, new failures appear that no single registry can express: name **collision** and **shadowing**. This is **structural, not linear in tool count** — the act of merging creates it, including for frontier models that were clean on the single-registry surface. Practical consequence: treat a namespace merge as a **review-worthy change**, not a config detail.\n- **A residual that cannot be eliminated.** \"Borrowed parameters\" — arguments that are schema-indistinguishable from legitimate calls — are explicitly described as the irreducible remainder. This is why the rung is necessary even after the surface is tightened.\n- **One hallucinated call is not a harmless parse error.** Malformed JSON gets rejected by a parser at the cost of a retry; a *syntactically valid* call to a non-existent tool passes every format check. For an agent that can act, that is an **unbounded action**, not a formatting mistake.\n- **Release artifact:** a versioned benchmark, **HTB**, accompanies the paper.\n\n## Key Quotes\n> \"工具幻觉，是指 agent 调用了注册表里根本不存在的工具，或给真实工具传了任何 schema 都没声明过的参数；而因为这种调用在构造上不是任何门做过的决策，所以必须在所有权限门控之前先做一次「注册表成员资格 + 签名」的封闭世界消解。\"\n\n> \"门控只能管住「你敢不敢用我放出来的工具」，管不住「你编了一个我从来没放出来的工具」—— 所以在所有门之前，必须先有一道很笨但很靠前的事实核对。\"\n\n> \"论文把它称作 Resolution Rung（消解阶），并强调它的价值不在算法而在位置：它只能装在最上游，必须早于任何权限门控。\"\n\n## Connections\n- [[ToolHallucination]] — the concept page this source primarily informs\n- [[MCP]] — directly extends it: merging MCP servers into one namespace is what produces collision/shadowing, and the source's ordering (`resolve()` → `policy.allows()`) belongs on MCP's dispatch path\n- [[AgentIdentity]] — ordering: the resolution rung must run **before** the authority check; identity answers \"may you\", the rung answers \"does it exist\"\n- [[HumanInTheLoop]] — pipeline position: propose → resolve → gate → idempotent execute. A gate cannot judge an unresolvable call\n- [[Agent]] — sharpens the \"not a fixed automation script\" boundary with a *factual* premise: the agent's tool universe must be closed and checkable\n- [[Skill]] — Skills document *when to call which tool*; they cannot make the registry closed, so they are complementary, not a substitute\n- [[ContextEngineering]] — explains the mechanism: hallucinated names arise from fluent language completion over seen call traces, so documentation and prompt edits cannot fix it — only external fact-checking can\n\n## Contradictions\n- **None detected** against existing wiki pages.\n- **⚠️ Source-level discrepancy recorded honestly (the material declined to use this number, and so does this page).** On the concentration of hallucinations across the two invocation surfaces, the arXiv abstract text writes `3434 vs. 33`, while two secondary sources (Cool Papers list page and the Chinese breakdown) both transcribe it as `34 vs. 3`. The totals **322** and the `34/3` split are self-consistent; `3434` is not. The material therefore cites **only the internally consistent set — 322 / 154 / 675B ≈ 7–8B** — and neither it nor this page uses that ratio. Resolve against the arXiv body text before citing it.\n- **Provenance caution:** the `322` / `154` / scale-invariance findings are attributed to arXiv:2609.19425v1 (2026-09-16) as the primary source and were cross-checked against an independent summary (MindPattern, 2026-09-16) by the material itself. The paper is a **2026-09-16 preprint** — not yet peer-reviewed at the time of ingestion.\n",

const nodes = new vis.DataSet(originalNodes);
const edges = new vis.DataSet(originalEdges);
const adjacency = new Map();
const searchInput = document.getElementById("search");
const stats = document.getElementById("stats");
const controls = {
  extracted: document.getElementById("cb-extracted"),
  inferred: document.getElementById("cb-inferred"),
  ambiguous: document.getElementById("cb-ambiguous"),
  confSlider: document.getElementById("conf-slider"),
  confValue: document.getElementById("conf-val"),
};
const nodeMap = new Map(originalNodes.map(node => [node.id, node]));
let activeNodeId = null;

function hexToRgba(color, alpha) {
  if (!color) return `rgba(255, 255, 255, ${alpha})`;
  const normalized = color.replace("#", "");
  const value = normalized.length === 3
    ? normalized.split("").map(ch => ch + ch).join("")
    : normalized;
  const intValue = Number.parseInt(value, 16);
  const r = (intValue >> 16) & 255;
  const g = (intValue >> 8) & 255;
  const b = intValue & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function escapeHtml(text) {
  return (text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function stripFrontmatter(markdown) {
  return (markdown || "").replace(/^---\n[\s\S]*?\n---\n?/, "");
}

function renderInlineMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink">[[$1]]</span>');
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return html;
}

function renderMarkdown(markdown) {
  const lines = stripFrontmatter(markdown).split(/\r?\n/);
  const html = [];
  let paragraph = [];
  let listType = null;
  let listItems = [];
  let quoteLines = [];
  let inCodeBlock = false;
  let codeLines = [];

  function flushParagraph() {
    if (!paragraph.length) return;
    html.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
    paragraph = [];
  }

  function flushList() {
    if (!listType || !listItems.length) return;
    const items = listItems.map(item => `<li>${renderInlineMarkdown(item)}</li>`).join("");
    html.push(`<${listType}>${items}</${listType}>`);
    listType = null;
    listItems = [];
  }

  function flushQuote() {
    if (!quoteLines.length) return;
    html.push(`<blockquote>${quoteLines.map(line => renderInlineMarkdown(line)).join("<br>")}</blockquote>`);
    quoteLines = [];
  }

  function flushCode() {
    if (!codeLines.length) {
      html.push("<pre><code></code></pre>");
      return;
    }
    html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
    codeLines = [];
  }

  for (const rawLine of lines) {
    const line = rawLine.replace(/\t/g, "    ");
    const trimmed = line.trim();

    if (trimmed.startsWith("```")) {
      flushParagraph();
      flushList();
      flushQuote();
      if (inCodeBlock) {
        flushCode();
        inCodeBlock = false;
      } else {
        inCodeBlock = true;
      }
      continue;
    }

    if (inCodeBlock) {
      codeLines.push(rawLine);
      continue;
    }

    if (!trimmed) {
      flushParagraph();
      flushList();
      flushQuote();
      continue;
    }

    const headingMatch = trimmed.match(/^(#(1, 6))\s+(.+)$/);
    if (headingMatch) {
      flushParagraph();
      flushList();
      flushQuote();
      const level = headingMatch[1].length;
      html.push(`<h${level}>${renderInlineMarkdown(headingMatch[2])}</h${level}>`);
      continue;
    }

    if (/^(-(3,)|\*(3,))$/.test(trimmed)) {
      flushParagraph();
      flushList();
      flushQuote();
      html.push("<hr>");
      continue;
    }

    const quoteMatch = trimmed.match(/^>\s?(.*)$/);
    if (quoteMatch) {
      flushParagraph();
      flushList();
      quoteLines.push(quoteMatch[1]);
      continue;
    }
    flushQuote();

    const unorderedMatch = trimmed.match(/^[-*]\s+(.+)$/);
    if (unorderedMatch) {
      flushParagraph();
      if (listType && listType !== "ul") flushList();
      listType = "ul";
      listItems.push(unorderedMatch[1]);
      continue;
    }

    const orderedMatch = trimmed.match(/^\d+\.\s+(.+)$/);
    if (orderedMatch) {
      flushParagraph();
      if (listType && listType !== "ol") flushList();
      listType = "ol";
      listItems.push(orderedMatch[1]);
      continue;
    }

    flushList();
    paragraph.push(trimmed);
  }

  if (inCodeBlock) flushCode();
  flushParagraph();
  flushList();
  flushQuote();
  return html.join("");
}

function rebuildAdjacency(filteredEdges) {
  adjacency.clear();
  for (const node of originalNodes) {
    adjacency.set(node.id, new Set());
  }
  for (const edge of filteredEdges) {
    if (!adjacency.has(edge.from)) adjacency.set(edge.from, new Set());
    if (!adjacency.has(edge.to)) adjacency.set(edge.to, new Set());
    adjacency.get(edge.from).add(edge.to);
    adjacency.get(edge.to).add(edge.from);
  }
}

function currentEdgeState() {
  const minConf = parseInt(controls.confSlider.value, 10) / 100;
  controls.confValue.textContent = minConf.toFixed(2);
  return {
    showExtracted: controls.extracted.checked,
    showInferred: controls.inferred.checked,
    showAmbiguous: controls.ambiguous.checked,
    minConf,
  };
}

function passesEdgeFilters(edge, edgeState) {
  const typeOk = (edge.type === "EXTRACTED" && edgeState.showExtracted)
    || (edge.type === "INFERRED" && edgeState.showInferred)
    || (edge.type === "AMBIGUOUS" && edgeState.showAmbiguous);
  const confOk = (edge.confidence ?? 1.0) >= edgeState.minConf;
  return typeOk && confOk;
}

function searchNodes(q) {
  applyFilters(q, activeNodeId);
}

function clearSelection() {
  activeNodeId = null;
  closeDrawer();
  applyFilters(searchInput.value, null);
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
}

function openDrawer(node, relatedIds) {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer-title").textContent = node.label;
  const communityText = Number.isInteger(node.group) && node.group >= 0 ? ` · community ${node.group}` : "";
  document.getElementById("drawer-meta").textContent = `${node.type}${communityText}`;
  document.getElementById("drawer-path").textContent = node.path;
  document.getElementById("drawer-preview").textContent = node.preview || "";
  document.getElementById("drawer-markdown").innerHTML = renderMarkdown(node.markdown || "");

  const relatedList = document.getElementById("drawer-related-list");
  relatedList.innerHTML = "";
  const relatedNodes = originalNodes
    .filter(item => relatedIds.has(item.id) && item.id !== node.id)
    .sort((a, b) => a.label.localeCompare(b.label));

  if (relatedNodes.length === 0) {
    const empty = document.createElement("span");
    empty.textContent = "No directly connected nodes";
    relatedList.appendChild(empty);
    return;
  }

  for (const related of relatedNodes) {
    const chip = document.createElement("button");
    chip.className = "related-chip";
    chip.textContent = related.label;
    chip.onclick = () => focusNode(related.id);
    relatedList.appendChild(chip);
  }
}

function applyFilters(query = searchInput.value, selectedNodeId = activeNodeId) {
  const lower = (query || "").trim().toLowerCase();
  const edgeState = currentEdgeState();
  const filteredEdges = originalEdges.filter(edge => passesEdgeFilters(edge, edgeState));
  rebuildAdjacency(filteredEdges);

  const relatedIds = selectedNodeId
    ? new Set([selectedNodeId, ...(adjacency.get(selectedNodeId) || [])])
    : null;
  const filteredNodeIds = new Set();
  for (const edge of filteredEdges) {
    filteredNodeIds.add(edge.from);
    filteredNodeIds.add(edge.to);
  }

  let visibleNodeCount = 0;
  const nodeUpdates = originalNodes.map(node => {
    const matchesSearch = !lower || node.label.toLowerCase().includes(lower);
    const isActive = selectedNodeId === node.id;
    const isConnected = filteredNodeIds.has(node.id);
    const isRelated = !relatedIds || relatedIds.has(node.id);
    const hidden = !selectedNodeId && !lower && !isConnected;
    const emphasized = matchesSearch && isRelated && (isConnected || !!lower || isActive);

    if (!hidden) {
      visibleNodeCount += 1;
    }

    return {
      id: node.id,
      hidden,
      color: {
        background: emphasized ? node.color : hexToRgba(node.color, hidden ? 0.05 : 0.14),
        border: emphasized ? hexToRgba(node.color, 0.96) : hexToRgba(node.color, hidden ? 0.08 : 0.22),
        highlight: { background: node.color, border: hexToRgba(node.color, 1) },
        hover: { background: node.color, border: hexToRgba(node.color, 1) },
      },
      font: {
        color: emphasized ? "#f2f3f8" : hidden ? "rgba(242,243,248,0.08)" : "rgba(242,243,248,0.2)",
      },
      borderWidth: isActive ? 5 : 2,
      size: isActive ? 18 : 12,
    };
  });

  const edgeUpdates = originalEdges.map(edge => {
    const enabled = passesEdgeFilters(edge, edgeState);
    if (!enabled) {
      return { id: edge.id, hidden: true };
    }

    const matchesSearch = !lower
      || nodeMap.get(edge.from)?.label.toLowerCase().includes(lower)
      || nodeMap.get(edge.to)?.label.toLowerCase().includes(lower);
    const isRelated = !relatedIds || relatedIds.has(edge.from) || relatedIds.has(edge.to);
    const touchesActive = !!selectedNodeId && (edge.from === selectedNodeId || edge.to === selectedNodeId);
    const emphasized = matchesSearch && isRelated;

    return {
      id: edge.id,
      hidden: false,
      width: touchesActive ? 2.8 : emphasized ? 1.2 : 0.6,
      color: emphasized ? edge.color : hexToRgba(edge.color, 0.08),
    };
  });

  nodes.update(nodeUpdates);
  edges.update(edgeUpdates);

  if (selectedNodeId) {
    const activeNode = nodeMap.get(selectedNodeId);
    if (activeNode) {
      openDrawer(activeNode, relatedIds || new Set([selectedNodeId]));
    }
  }

  const focusSuffix = selectedNodeId && nodeMap.get(selectedNodeId)
    ? ` · focused: ${nodeMap.get(selectedNodeId).label}`
    : "";
  stats.textContent = `${visibleNodeCount} nodes · ${filteredEdges.length} edges${focusSuffix}`;
}

const container = document.getElementById("graph");

// Adaptive physics based on graph size
const nodeCount = originalNodes.length;
const gravConst = nodeCount > 80 ? -8000 : nodeCount > 30 ? -5000 : -2000;
const springLen = nodeCount > 80 ? 250 : nodeCount > 30 ? 200 : 150;

const network = new vis.Network(container, { nodes, edges }, {
  nodes: {
    shape: "dot",
    font: { color: "#ddd", size: 12, strokeWidth: 3, strokeColor: "#111" },
    borderWidth: 1.5,
    scaling: {
      min: 8,
      max: 40,
      label: { enabled: true, min: 10, max: 20, drawThreshold: 6, maxVisible: 24 },
    },
  },
  edges: {
    width: 0.8,
    smooth: { type: "continuous" },
    arrows: { to: { enabled: true, scaleFactor: 0.4 } },
    color: { inherit: false },
    hoverWidth: 2,
  },
  physics: {
    stabilization: { iterations: 250, updateInterval: 25, fit: true },
    barnesHut: { gravitationalConstant: gravConst, springLength: springLen, springConstant: 0.02, damping: 0.15 },
    minVelocity: 0.75,
  },
  interaction: { hover: true, tooltipDelay: 150, hideEdgesOnDrag: true, hideEdgesOnZoom: true },
});

// Ensure the graph fits the viewport after physics stabilization
network.once("stabilizationIterationsDone", function () {
  network.fit({ animation: { duration: 400, easingFunction: "easeInOutQuad" } });
});

function focusNode(nodeId) {
  activeNodeId = nodeId;
  applyFilters(searchInput.value, nodeId);
  const node = nodeMap.get(nodeId) || nodes.get(nodeId);
  const relatedIds = new Set([nodeId, ...(adjacency.get(nodeId) || [])]);
  openDrawer(node, relatedIds);
  network.focus(nodeId, {
    scale: 1.1,
    animation: { duration: 300, easingFunction: "easeInOutQuad" },
  });
}

network.on("click", params => {
  if (params.nodes.length > 0) {
    focusNode(params.nodes[0]);
  } else {
    clearSelection();
  }
});

applyFilters();
</script>
