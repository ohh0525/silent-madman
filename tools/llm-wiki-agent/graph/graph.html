    "markdown": "---\ntitle: \"Overview\"\ntype: synthesis\ntags: []\nsources: [agent, llm-context, skill, context-engineering, agent-memory-provenance, mcp-2026-07-28, agent-identity, human-in-the-loop, tool-hallucination, agent-harness, agent-sandbox, multi-agent, memory-lifecycle]\nlast_updated: 2026-10-09\n---\n\n# Overview\n\n*This page is maintained by the LLM. It is updated on every ingest to reflect the current synthesis across all sources.*\n\n## Current Synthesis (2026-10-09)\n\nThirteen sources: twelve silent-madman concept-learning documents plus a spec digest of the MCP 2026-07-28 revision. The synthesis now has **two halves that answer different questions**. Clusters A–C ask *what the agent knows and sees, and how honestly it remembers* — the **entity side**. Cluster D, ingested 2026-09-24, asks *who the agent is, what it is permitted to do, and whether the thing it just called even exists* — the **actor side**. Cluster E, ingested 2026-09-26, asks *what actually runs the loop* — the **runtime side**. The first two are the **reading discipline** and the **acting discipline**; the third is their **host**: every mechanism in A–D is a part inside a shell that had gone un-named until now. **Cluster F, ingested 2026-10-09, goes back *inside* Cluster B and asks the question the wiki had left at the edge of its own frame**: durable memory is not a store but **four actions that each fail differently**, and someone has to hold the decision rights over them. It is not a new domain — it is the **second half of a memory's life**, and the point at which the reliability discipline and the security discipline merge.\n\n### Cluster A — Bounded resources (2026-09-05)\n- **[[Agent]]** is the autonomous execution layer — a system that picks tools and loops around a goal.\n- **[[LLMContext]]** is the hard constraint Agent operates under — a token-budgeted \"desktop\" bounded by [[Transformer]]'s n² cost.\n- **[[Skill]]** is the unit that lets a general model act like a domain expert without bloating context — via **[[ProgressiveDisclosure]]**.\n\n### Cluster B — Methodology + time (2026-09-16)\n- **[[ContextEngineering]]** answers *who decides what goes on the desk*: it manages the window by layering information by lifespan, retrieving just-in-time, and trimming/re-injecting each turn. It battles **[[ContextRot]]** and uses **[[Compaction]]** for long tasks. Crucially, it reframes Cluster A: [[ProgressiveDisclosure]] is *an instance* of context engineering, not a separate mechanism.\n- **[[LongTermMemory]]** answers *what happens across sessions*: the window cannot hold durable state, so it lives outside and is re-injected. The 2026 design bet is **three parallel memories** (episodic / associative / semantic-HDM) governed by a reading discipline — **[[Provenance]]** (every fact carries origin + time + evidence), **[[CitationLock]]** (cite only what you opened), and **[[Abstention]]** (no sourced evidence ⇒ refuse). Systems: [[MemGPT]], [[AgentZeroMemory]], [[Zep]]; evidence: [[LongMemEval]].\n\n### Cluster C — Protocol refresh (2026-09-16)\n- **[[MCP]]** was the one page that had gone stale. The **MCP 2026-07-28 revision** makes the protocol **stateless at the protocol layer**: the `initialize` handshake (SEP-2575) and `Mcp-Session-Id` (SEP-2567) are gone; every request carries version + client identity in `_meta`; `Mcp-Method`/`Mcp-Name` headers enable body-free routing; list results are cacheable (`ttlMs`/`cacheScope`); server→client requests use MRTR (SEP-2322). The **[[Skill]]** boundary is unchanged. Ecosystem impact: GitHub's server dropped Redis + deep packet inspection; Manufact −83% package size, +25% speed.\n\n### Cluster D — Actor side: authority, control, factualness (2026-09-22, ingested 2026-09-24)\n- **[[AgentIdentity]]** — *who acts, on whose behalf.* Workload identity + OAuth 2.0 Token Exchange (RFC 8693, carrying a **dual subject**: actor + represented user) + **per-hop attenuation** (a child agent receives a freshly issued, strictly narrower credential — scope / magnitude / validity / depth may only shrink) + dual-subject audit wired to propagated revocation. [[MCP]]'s authorization profile (HTTP servers as OAuth 2.1 resource servers implementing RFC 9728; clients implementing PKCE S256 and refusing when it is unsupported) is its concrete instance.\n- **[[HumanInTheLoop]]** — *may it act, now.* Grade every action by **impact × reversibility**, then gate the irreversible classes on the rule \"**read freely, keep writes human**\". The rule must live **in code/config, not the prompt**; the pause must be **persisted** and the resume **idempotent**; effectiveness is measured by automation / override / **escape** rate and review latency.\n- **[[ToolHallucination]]** — *does the tool exist.* Calls to tools that are **not in the registry**, or with undeclared arguments. Such a call is **not a decision any gate ever made**, so it survives every permission check by construction — hence a **closed-world resolution rung** (registry membership + signature verification) placed **upstream of every gate**.\n\nThe three compose into one **fixed order**, and the order *is* the content:\n\n```\npropose ──▶ resolve ──▶ authorize ──▶ gate ──▶ idempotent execute\n            (exists?)    (may you?)   (now?)\n       ToolHallucination  AgentIdentity  HumanInTheLoop\n```\n\n### Cluster E — Runtime side: the loop's host, where it runs, who it works with (2026-09-26)\n- **[[AgentHarness]]** — *what runs the loop.* The engineering shell that turns one model call into an agent: **`Agent = Model + Harness`**. Four duties — assemble context (tool search over schema injection), run the loop and judge stopping, govern the window (automatic **[[Compaction]]**), keep alive / recover / schedule subagents. It is the **container** of the wiki's mechanism pages, not a peer of them: OpenAI's three Agents-API headline features (compaction / tool search / multi-agent) are exactly pre-existing wiki concepts. Boundary: decides **who orchestrates**, while the sandbox decides **where it runs** (OpenAI splits this as separate `Agent` / `Environment` objects).\n- **[[AgentSandbox]]** — *where it runs, what it can touch.* Kernel-level containment (gVisor / Kata / per-sandbox VM) + declarative allow-lists; **authority is not isolation** — a fully legitimate, fully approved action can still run somewhere it can write through the host kernel. This fills the **`execute` leg** of Cluster D's chain, the gap this overview had named since 2026-09-24. As of 2026-09 it is standardised infrastructure (`kubernetes-sigs/agent-sandbox` into SIG Apps; Google AX open-sourced; Alibaba Cloud commercialised). Strongest evidence it is necessary: HF's 2026-07 intrusion anatomy — an allow-list correctly rejected the SSRF, the agent **switched paths** and still leaked pod secrets; *a single layer of defence that denies one path does not close the surface.*\n- **[[MultiAgent]]** — *who it works with.* The wiki's first **between-agents** page: peer agents with independent windows exchange **verified** partial results and failure paths through a shared workspace — team@5 ≈ best@33 on ARC-AGI-3 (≈6.6× equivalent compute), LP85 64-independent-all-failed vs team@5 65%. The teaching spine is the counter-result: **fails without verifier or low compute** — the verifier is the precondition, otherwise the shared workspace degrades into **cross-contamination** (互相污染, an unverified peer conclusion inherited as premise — [[Provenance]]'s extension line). Productised as Anthropic's Claude Code Projects (coordinator → parallel cloud threads → shared memory → ordinary merge conflicts; threads each burn quota; CI/tests/human review remain the integration boundary); decentralised scale via Agensh (1,024 agents, no central orchestrator). **Evidence grade: secondhand throughout** (AlphaSignal's report of the paper, arXiv not opened; Agensh secondhand; Projects shared memory \"no detailed performance evaluation\") — direction-and-magnitude only.\n- The layer became **managed infrastructure in 2026-09** (\"Harness Wars\"): OpenAI rents the Codex harness (public beta 2026-09-10), [[Anthropic]] counters with Opus 5.5 managed orchestration. Managed ≠ safe: egress defaults `enabled`, `restricted` takes only 1–100 exact hostnames, secrets injected into the environment remain exposed — the defaults *are* the security boundary, and same-week Codex sandbox escapes (Heapjack / Overpatch) show management centralises patching, not risk. [[Skill]] is becoming this ecosystem's packaging format (372 / 216 / 193 skills, 2026-09).\n\n### Cluster F — Memory governance: the second half of a memory's life (2026-10-06 material, ingested 2026-10-09)\n- **[[MemoryGovernance]]** — *how durable memory changes, and under whose authority.* Memory split into **four separately measured actions** (Capture → Update → Recall → QA; [[DyadMem]]: 3,065 episodes / 50,961 sessions / 61,210 QA, gold annotations at **every** stage). Its sharpest measurement: frontier models are strong **given gold memory** and **collapse on the full pipeline** — so the bottleneck is **the quality of the four actions**, not window capacity. The load-bearing variable is **who decides**, and there are exactly three classes: **human-written rules** (today's default — thresholds and TTLs, with *no judgement about what counts as stale*) · **trained policy** (2026's answer: **ADD · UPDATE · DELETE · NOOP placed in the action space**; Memory-R1 trains on **152 QA pairs** and gains **LoCoMo F1 +68.9%** over Mem0 across six independent teams — of which **none is deployed**) · **attacker** (next bullet). Forgetting is a **capability**, not a failure: Memora's **FAMA** = recall score − **stale-dependency penalty**. Four bottom lines: **auditable · rollbackable · permissioned · signature-verified.**\n- **[[MemoryPoisoning]]** — *who else can write it.* Not a fourth failure mode but the **third decider**: the adversary **claims the same three decisions**. Two mechanisms — **induced self-write** (PMPA: a **benign** document makes the harness write the payload into durable memory itself — Claude Code **66.9% / 81.7%**, with **benign-task quality unchanged**) and **forged conversation history** (Darktrace: **all four harnesses** accept forged history; under Kiro-CLI the chain reaches **Active Directory domain takeover**). Prompt-level defence protects poorly **after** poisoning, and the root fix is **vendor-side** message signing validated server-side ⇒ *disclosed ≠ mitigable by you.*\n- **Boundary (why F is a seam, not a seventh parallel topic):** governance runs **outside** the window and across sessions, where [[Compaction]] runs **inside** and per-turn; it is the **lifecycle** to [[Provenance]] / [[CitationLock]] / [[Abstention]]'s **entry and exit discipline** — *a clean entry does not imply a clean lifecycle*, since PMPA's payload arrives **wearing legitimate provenance**. It also finally supplies the **second half** of [[LongTermMemory]], which had carried an explicit `pending ingest` banner **asking to be cleared by exactly this ingest** (banner cleared 2026-10-09).\n- **Cross-cutting join:** [[MultiAgent]]'s **cross-contamination** and memory poisoning are the **same failure shape one layer apart** — *an unverified premise inherited as fact.* Both extend [[Provenance]]'s object from *facts* to *the verification status of what you are treating as fact.*\n\n### How they connect\n\n```\n                        ┌─────────────── ENTITY SIDE (what it knows) ───────────────┐\nContext Engineering ──manages/crops──▶ LLM Context Window ◀──supplies trusted── Long-Term Memory\n        │                                    ▲                      facts            │\n        │ Progressive Disclosure             │                                       │\n        │ is one instance of it              │                          Provenance /  │\n        ▼                                    │                          CitationLock /│\n      Skill ──────loads into─────────────────┘                          Abstention    │\n                                                   Agent reads/writes ─────────────────┘\n\n                        ┌─────────────── ACTOR SIDE (what it may do) ───────────────┐\n   model proposes ──▶ resolve ──▶ authorize ──▶ gate ──▶ idempotent execute ──▶ audit\n                     (ToolHallucination) (AgentIdentity) (HumanInTheLoop)      record\n                                                                                ▲\n                            same traceability instinct as Provenance ───────────┘\n\n                        ┌─────────────── RUNTIME SIDE (what runs the loop) ─────────┐\n   Agent Harness ──hosts──▶ the Agent loop — and inside it: Compaction · tool search ·\n   (Agent = Model           the resolution rung · Skill loading · subagent scheduling\n    + Harness)                                     │ pluggable\n                                                  ▼\n                        Agent Sandbox (execute leg) ── gVisor / Kata / per-sandbox VM;\n                        declarative egress allow-lists; authority ≠ isolation\n                                        ▲\n                                        │ peer teams exchange verified progress\n                        Multi-Agent (collaboration leg) ── team@k ≈ best@4-7k; the\n                        verifier is the precondition; cross-contamination is the\n                        new failure surface\n```\n\nThe thirteen-page story: **an Agent, bounded by a Context Window, uses Skills to load knowledge on demand; Context Engineering decides what belongs in that window each step; provenance-aware Long-Term Memory lets it remember across sessions — honestly. On the acting side, it proves who it is with strictly narrowing authority, asks a human before the irreversible step, and can only call tools that provably exist — and even if all of that fails, the sandbox bounds what the action can touch. All of it runs inside a harness that as of 2026-09 is itself becoming managed infrastructure — and when one harness is not enough, several can work as a team, provided the task carries its own verifier. And what it remembers is not a database it merely owns: it is four actions it must keep running correctly, under decision rights somebody has to hold — because a vacant ownership slot does not stay vacant.**\n\n## Cross-Cutting Themes\n- **Bounded context is the central constraint** — every concept in Clusters A–C traces back to a token / window / cost limit. [[ContextRot]] sharpens it: capacity ≠ effective capacity.\n- **\"On-demand loading\" is the dominant solution shape** — Skills (progressive disclosure), RAG, and memory retrieval all share it. [[ContextEngineering]] names it as a principle.\n- **Trust is the new frontier** — Cluster A assumed more/cleaner context; Cluster B adds that retrieved context must be *sourced and current* ([[Provenance]], [[CitationLock]], [[Abstention]]); Cluster D adds that the **actor** must be sourced and constrained too. Trust now has two objects: the *fact* and the *hand*.\n- **Memory errors compound** — a mistake written to durable memory recurs; this reframes memory as a *reliability subsystem*, not a recall feature.\n- **NEW (2026-09-24) — the model is not the only place to put a control.** Every mechanism in Clusters A–C has **the model itself** as its subject: they are *honesty* mechanisms, enforced by the model's own behaviour. Cluster D moves three levers **outside** the model — issuance (an identity authority), attenuation (a credential chain), and deterministic gating (code). Both the [[human-in-the-loop]] and [[tool-hallucination]] sources are explicit that the gate/rung must **not** be a prompt-resident rule, precisely because a prompt can be ignored, overridden or talked around. This is the first time the wiki records a control whose subject is not the LLM.\n- **NEW (2026-09-24) — ordering is a first-class design object.** Three times now the answer has been *where* a mechanism sits rather than how strong it is: the resolution rung must precede every gate; the authorization check precedes the gate; and the gate precedes execution. A control in the wrong position is not a weaker control — it is not a control.\n- **NEW (2026-09-26) — the loop needs a host.** Every mechanism page in Clusters A–D implicitly ran inside something that no page named. [[AgentHarness]] names it, and in doing so reorganises the wiki: compaction, the resolution rung, Skill loading and subagent scheduling stop being peers and become **parts of one shell**. The test this suggests for future gaps: for each page, ask *what does this mechanism run inside, and does that thing have a page?*\n- **NEW (2026-09-26) — vendor defaults are citable; vendor benchmarks are not.** The harness sources split cleanly into two grades: **documented defaults** (egress `enabled` by default; `restricted` = 1–100 exact hostnames; secrets remain exposed) are facts about the product and can be cited; **self-reported performance** (latency ~¼, cost −60%, failures −86%) is marketing-grade until independently reproduced. The wiki should keep these two grades in separate columns whenever it records vendor claims.\n- **NEW (2026-09-26) — the verifier is the precondition of collaboration.** [[MultiAgent]]'s headline (team@5 ≈ best@33) ships with its own counter-result (\"fails without verifier or low compute\") — the first wiki entry whose *boundary condition is the content*. Portable rule: **first find a cheap way to judge correctness, then form the team.** Its new failure surface, cross-contamination, extends [[Provenance]] from fact-origin to the verification status of peers' conclusions.\n- **NEW (2026-10-09) — the governance turn: from *where state lives* to *who decides its fate*.** Clusters A–C asked where cross-session state lives and how to read it credibly. Cluster F asks the two questions that follow: **how does it change**, and **who is entitled to change it**. The third decider is not a design option — it is the **default when nobody chooses**, which is why a memory policy is a **security** control and not only a hygiene one.\n- **NEW (2026-10-09) — a vacant control slot does not stay vacant.** First stated for memory (“if memory has no owner, the owner slot does not stay vacant — it flows to whoever wants to exploit it”), this generalises the older theme *the model is not the only place to put a control*: an **unclaimed** control is worse than a bad one, because an adversary claims it **silently**. Its measurement corollary: **“failed to forget” is a deductible score (FAMA) — and so is “deleted something still in use.”**\n- **[[Anthropic]] is the primary vendor** contributing this design vocabulary; [[OpenAI]] complements; memory systems now contribute [[AgentZeroMemory]], [[MemGPT]], [[Zep]]; the actor side draws on a wider set (Microsoft Entra Agent ID, Okta, and the OAuth/IETF layer) — the first cluster not dominated by one vendor.\n\n## Open Questions (suggested next sources)\n- A concrete RAG system case study (vector DB choice, chunking strategy, retrieval quality) — still open from 2026-09-09, now the **oldest** open item.\n- ~~The MCP stateless revision (2026-07-28 spec)~~ — **resolved 2026-09-16**: [[MCP]] page rewritten from [[mcp-2026-07-28]].\n- How [[ContextEngineering]] techniques are measured end-to-end (beyond single-provider claims) — needs an independent evaluation.\n- Multi-agent memory sharing and role-based access control on shared persistent memory. (**Orchestration side covered 2026-09-26** by [[MultiAgent]] — Claude Code Projects' shared project memory is the product instance. **The governance half is now *named* as of 2026-10-09** by [[MemoryGovernance]]'s third bottom line — *who may write to shared memory must be managed as explicitly as database permissions* — and by [[MemoryPoisoning]]'s write-authority model; what remains **unwritten** is a concrete cross-agent policy language or product.)\n- **NEW (2026-10-09) — memory governance has no production evidence.** All six learned-policy systems are **undeployed**; their benchmarks exclude distribution shift and adversarial input; and no single system yet owns write + retrieval + transformation together. Open sub-question: **when does the vendor-side fix for the forged-history class ship** (signed model replies validated server-side)?\n- **NEW (2026-10-09) — the wiki has no page for *transient* indirect prompt injection**, even though [[MemoryPoisoning]] now leans on the distinction (*transient injection* vs the **persistence step** that makes it durable). Candidate for a dedicated page rather than a section.\n- MCP **Tasks / MCP Apps / EMA** extensions — now first-class; worth a dedicated page if usage grows.\n- ~~**NEW — execution isolation as the missing third leg.**~~ — **resolved 2026-09-26**: [[AgentSandbox]] now fills the `execute` leg of Cluster D's chain (K8s SIG Apps upstream + Google AX + Alibaba Cloud commercialisation + the HF intrusion anatomy as motive evidence; radar candidate 2026-09-21).\n- **NEW — persistent execution.** The gate's own requirement — that a paused workflow be resumable by a *different* process, days later — is a durable-execution requirement. (**Partially covered 2026-09-26**: keep-alive / crash recovery is harness duty ④ on [[AgentHarness]], and pause/resume is a sandbox capability on [[AgentSandbox]]; what remains unwritten is the cross-runtime semantics comparison — event replay vs checkpoint adoption vs snapshot. Radar candidate 2026-09-23.)\n- **NEW — independent verification of Cluster D's numbers.** Several figures (28% traceability, 1–2 vs 3–6 engineer-weeks) come from third-party/commercial pages rather than primary vendors; see the provenance note on [[agent-identity]]. The 322 / 154 hallucination counts come from a **preprint** (arXiv:2609.19425v1, 2026-09-16), not peer-reviewed — and the material already records one internal inconsistency in its numbers (`3434 vs 33` vs `34 vs 3`) that it declined to use.\n\n## Next Ingest Suggestions\n- `raw/papers/rag-survey.md` — RAG foundations (the oldest open gap)\n- `raw/papers/context-engineering-eval.md` — independent context-engineering evaluation\n- ~~`raw/papers/agent-sandbox-isolation.md`~~ — **resolved 2026-09-26**: [[AgentSandbox]] ingested from the concept-learning material (K8s upstream evidence included); a dedicated *paper* on isolation could still deepen it, but the page exists\n- **NEW** an **independent** evaluation of the agent-identity traceability / attenuation claims — the current figures are vendor-survey grade\n- **NEW (2026-09-26)** the OpenAI developer documentation for the Agents API itself — the harness material's claims all trace to verified secondary sources; the primary docs were not opened first-hand\n- **NEW (2026-09-26)** the arXiv primary for the Microsoft Research + UC Berkeley team@k paper (repo `github.com/jerryjonghopark/test-time-communication` given; abstract page not opened) — [[MultiAgent]]'s numbers are secondhand until this is done\n- **NEW (2026-10-09)** an **independent reproduction** of any of Cluster F's load-bearing numbers — [[DyadMem]]'s Gold-Memory/Full-Pipeline gap, Memora's FAMA, PMPA's injection rates, or any learned-memory-policy system **outside its own benchmark**. The entire Cluster F evidence base is **author-reported**\n- **NEW (2026-10-09)** the **vendor-side signing** primary (Anthropic / OpenAI / AWS response to the Darktrace disclosure) — the wiki records the attack and records that defenders *cannot deploy the fix*, but has not opened the vendor side\n",

    "markdown": "---\ntitle: \"Abstention\"\ntype: concept\ntags: [agent-memory, abstention, reliability]\nsources: [agent-memory-provenance]\nlast_updated: 2026-09-16\n---\n\n# Abstention\n\nThe ability of a memory system to refuse to answer when it lacks sourced evidence — treating \"I don't know\" / \"unknown\" as a correct state transition rather than a failure.\n\n## Mechanism (per [[agent-memory-provenance]])\n- Built into the reading discipline: if no sourced evidence was opened, the system returns an abstention instead of a plausible guess.\n- One of LongMemEval's five core long-term-memory abilities (information extraction, multi-session reasoning, temporal reasoning, knowledge updates, **abstention**).\n- Depends on [[Provenance]] and [[CitationLock]]: without them the system cannot tell an established sourced fact from something merely asserted once.\n\n## Why It Matters\n- The dangerous failure is not a wrong answer per se, but confidently stating something that cannot be traced to a source — poisoning future plans.\n- Benchmark evidence ([[LongMemEval]]): abstention is one of the abilities where commercial assistants and long-context LLMs degrade most.\n- \"Abstention is not the system being dumb\" — hard-answering with a reasonable-sounding guess is what writes hallucination into the future.\n\n## See Also\n- [[agent-memory-provenance]] — primary source\n- [[CitationLock]] · [[Provenance]] — the enabling constraints\n- [[LongMemEval]] — benchmark that scores abstention\n- [[LongTermMemory]] — the system exercising it\n",

    "type": "concept",
    "color": "#8BC34A",
    "path": "wiki\\concepts\\Agent.md",
    "markdown": "---\ntitle: \"Agent\"\ntype: concept\ntags: [ai-agent, llm, autonomous-system, authority, runtime]\nsources: [agent, skill, agent-identity, human-in-the-loop, tool-hallucination, agent-harness]\nlast_updated: 2026-09-26\n---\n\n# Agent\n\nA software system driven by a large language model that autonomously decides which tools to call around a target, observes results, and loops until the task completes or control is yielded.\n\n## Definition\nPer [[agent]] source: Agent 是组织好的 LLM + 工具 + 记忆 + 循环。\n\n## Core Mechanism (from [[agent]])\n1. **Receive goal + context** — translate fuzzy intent into executable target\n2. **Reason next action** — ReAct / Chain-of-Thought pick tool + params\n3. **Execute tool + collect observation** — external executor does the work\n4. **Update state + judge stop** — merge observation, decide done or loop back\n\nA canonical pseudo-code:\n\n```\nwhile not done:\n    thought    = model.reason(goal, history)\n    if thought.is_final_answer: return thought.answer\n    tool_call  = model.choose_tool()\n    observation = execute(tool_call)\n    history.append((thought, tool_call, observation))\n```\n\n## Boundary\n- **Not a chatbot** — must dynamically control flow, not just answer questions\n- **Not a fixed automation script** — steps are auto-determined, not pre-encoded\n- **Not AGI** — bounded by permissions, token budget, stopping condition\n\n## Practical Use\n| Use Agent | Use Script |\n|---|---|\n| Steps cannot be enumerated in advance | Steps are fixed, repeated |\n| Need to adapt based on results | Millisecond-SLA hot paths |\n| Single failures acceptable via retry | Any failure is irreversible |\n\n## Authority axis (added 2026-09-24, per [[agent-identity]] · [[human-in-the-loop]] · [[tool-hallucination]])\nThe Boundary section above says an Agent is \"bounded by permissions, token budget, stopping condition\". That sentence named a ceiling but never said **who grants it, how far it travels, or who checks whether the action was physically possible**. Three pages now supply that axis:\n\n| Question | Page |\n|---|---|\n| **Who is acting, on whose behalf, and how far may that authority travel?** | [[AgentIdentity]] — workload identity + RFC 8693 token exchange + strictly narrowing per-hop attenuation + dual-subject audit |\n| **May it do this, or must a person approve first?** | [[HumanInTheLoop]] — grade by impact × reversibility; read freely, keep writes human; the rule lives in code, not the prompt |\n| **Does the thing it just called even exist?** | [[ToolHallucination]] — a closed-world resolution rung *before* any gate, because a hallucinated call is not a decision any gate ever made |\n\nThe ordering between them is not decoration: **resolve the call → verify authority → gate the irreversible step**. Read in that order, the agent's loop above (reason → choose tool → execute) acquires the three failure checks it was missing. This also fixes a boundary previously left implicit: an Agent's loop can be *correct* and still *unauthorized*, *unapproved*, or *aimed at a tool that does not exist* — three independent ways to fail that \"did it complete the task?\" cannot detect.\n\n## Runtime axis (added 2026-09-26, per [[agent-harness]])\nEverything above describes the loop's **semantics**. Something must actually *run* that loop — assemble the prompt, inject tool definitions, execute calls, compact the window near its limit, resume after crashes, schedule subagents. That engineering shell is the **harness**, giving the canonical split **`Agent = Model + Harness`**. The wiki's mechanism pages ([[Compaction]], [[ToolHallucination]]'s rung, [[Skill]] loading, [[ContextEngineering]]'s per-turn policy) are **parts inside that shell**; as of 2026-09 the shell itself is being productised as managed infrastructure by both [[OpenAI]] (Agents API on the Codex harness) and [[Anthropic]] (Opus 5.5 managed orchestration). See [[AgentHarness]].\n\n## See Also\n- [[Skill]] — the packaging unit that turns general models into domain experts\n- [[LLMContext]] — Agent operations constrained by context window\n- [[ProgressiveDisclosure]] — load-on-demand that lets Agents use Skills within bounded context\n- [[ReAct]] — reasoning pattern used in Agent's step 2\n- [[Anthropic]] / [[OpenAI]] — primary vendors shaping Agent design vocabulary\n- [[AgentIdentity]] · [[HumanInTheLoop]] · [[ToolHallucination]] — the authority / control / factualness axis (see above)\n- [[AgentHarness]] — the runtime axis: the shell that hosts and executes this page's loop (see above)",

    "path": "wiki\\concepts\\AgentHarness.md",
    "markdown": "---\ntitle: \"Agent Harness\"\ntype: concept\ntags: [agent-harness, runtime, orchestration, durability, subagents]\nsources: [agent-harness]\nlast_updated: 2026-09-26\n---\n\n# Agent Harness (智能体外壳)\n\nThe engineering shell that turns **one model call** into **an agent that gets work done**: it assembles the prompt, retrieves and injects tool definitions, executes tools, decides what to drop when the window fills, resumes after crashes, and schedules subagents. It is neither the model nor the business logic — it is **the loop code between the model and the real world**. Canonical split: **`Agent = Model + Harness`**.\n\n## Mechanism (per [[agent-harness]])\nFour duties per loop; miss any one and the agent degrades from \"works\" to \"demo\":\n- **① Assemble context** — system prompt + tool definitions into this turn's request; modern harnesses use **tool search** (retrieve tool schemas on demand) instead of injecting every schema every turn. *What goes in the window decides both the agent's sight and its cost.*\n- **② Run the loop and judge stopping** — request → parse tool call → execute → write observation back → decide done / continue / give up. *Autonomy is this loop; a loop without a stop condition is an infinitely expensive loop.*\n- **③ Govern the window** — near the context limit, automatically summarise earlier context (**automatic compaction**) so the task spans multiple windows instead of breaking at the boundary. *Long-task bottleneck is window size, not model intelligence: whoever decides \"what gets dropped when full\" holds long-task quality.*\n- **④ Resilience & scale** — session keep-alive and crash recovery (real tasks run for days; a single process loop cannot survive that), plus subagent scheduling (the harness itself provides create / message / wait / interrupt; enabled by a flag + `max_concurrent_subagents`).\n\n## Boundary\n- **Not [[Agent]]** — semantics vs implementation. [[Agent]] describes the loop's *semantics* (reason → choose tool → execute → observe); the harness is that loop's concrete *implementation* — who assembles prompts, who manages the tool table, who runs compaction, who handles recovery.\n- **Not any single mechanism page — it is their container.** [[Compaction]], [[ToolHallucination]]'s resolution rung, [[Skill]] loading, [[ContextEngineering]]'s per-turn policy are all **parts inside the shell**; the harness decides *when each part fires and with what threshold*. Corroboration: OpenAI's three headline features (automatic compaction / tool search / multi-agent) are exactly pre-existing wiki concepts.\n- **Not [[ContextEngineering]]** — principles vs program. Context engineering is the *policy* of what belongs in the window each step; the harness is *the program that executes that policy*.\n- **Not the sandbox** — the harness decides **who orchestrates**; the sandbox decides **where it runs and what it can touch**. OpenAI makes the split explicit as separate `Agent` and `Environment` objects (environment optional: `openai_hosted` / `self_hosted` / `none`); the two should be chosen separately. See [[AgentSandbox]].\n\n## Why It Matters\n- **It names the wiki's implicit host.** Every mechanism page was already describing a part of this shell; the wiki had the parts and lacked the container. Naming it turns a pile of techniques into a runtime architecture.\n- **As of September 2026 the shell itself became infrastructure.** OpenAI's Agents API public beta (2026-09-10) rents out the Codex harness — durable sessions, automatic compaction, tool search, subagents, pluggable environments; Anthropic plays the same layer with Opus 5.5 \"managed orchestration\". Agent Brief names it \"Harness Wars\" and frames it as *orchestration as managed infrastructure* — the layer LangChain/CrewAI used to sell, now offered by the model vendors themselves.\n- **Managed ≠ safe.** The defaults are the security boundary and they are permissive: egress defaults to `enabled`; `restricted` mode accepts only 1–100 exact hostnames (no wildcards/paths/ports); injected secrets remain exposed to agent-generated code. Same-week Codex sandbox escapes (Heapjack / Overpatch) show managed harnesses *centralise* patch responsibility, they do not remove sandbox risk.\n- **Honest numbers discipline:** vendor performance claims (latency ~¼, cost −60%, failures −86%) are self-reported and must be discounted; documented defaults are citable facts, self-reported performance is not.\n\n## See Also\n- [[agent-harness]] — source\n- [[Agent]] — the loop semantics this shell implements (runtime axis added there)\n- [[Compaction]] — harness duty ③ in detail\n- [[ToolHallucination]] — the resolution rung lives in the harness's dispatch path\n- [[Skill]] — the packaging format the harness loads on demand; becoming the ecosystem standard (372 / 216 / 193 skills, 2026-09)\n- [[ContextEngineering]] — the policy the harness executes\n- [[HumanInTheLoop]] — its pause/resume requirements are harness durability requirements\n- [[MCP]] — remote MCP tools are called by the harness even with no environment selected\n- [[AgentSandbox]] — the execution environment the harness plugs into (added 2026-09-26)\n- [[MultiAgent]] — subagent scheduling (duty ④) productised; the team-vs-single trade-off has its own page (added 2026-09-26)\n- [[OpenAI]] · [[Anthropic]] — the two vendors simultaneously productising this layer\n",

    "path": "wiki\\concepts\\AgentIdentity.md",
    "markdown": "---\ntitle: \"Agent Identity\"\ntype: concept\ntags: [agent-identity, delegation, iam, oauth, security]\nsources: [agent-identity]\nlast_updated: 2026-09-24\n---\n\n# Agent Identity (Delegated Authority)\n\nThe verifiable claim an agent makes about **who it is, on whose behalf it acts, and what it is permitted to do** — plus the mechanisms that keep that authority from *widening* as it propagates between agents.\n\n## Mechanism (per [[agent-identity]])\n1. **Workload identity** — the running software instance is issued an identity a relying party can verify. Not a copy of a human account.\n2. **Token exchange (OAuth 2.0 Token Exchange, RFC 8693)** — the agent trades the user's token for a **short-lived, audience-restricted** token carrying a **dual subject**: the *actor* (which agent is acting) and the *subject* (which user is represented).\n3. **Per-hop attenuation** — a child agent receives a **freshly issued, strictly narrower** credential: scope / magnitude / validity / delegation depth may only shrink. RFC 8693 *records* delegation; it does not *guarantee* attenuation.\n4. **Dual-subject audit + propagated revocation** — each request retains both the executing workload and the represented user, wired to revocation propagation so one revocation reaches every agent still holding an old token.\n\n## Boundary\n- **vs. a name in the prompt** — self-description is not identity; identity must be *issued* and *independently verifiable*.\n- **vs. API keys / shared service accounts** — static secrets express no delegation (\"on whose behalf\"), produce no per-action trace, and cannot be revoked per action. A shared human account adds a silent failure: when the human leaves, the agent's access dies with them.\n- **Not one thing but four** — identity (*who is calling*) / delegation (*on whose behalf*) / authorization (*what is allowed*) / runtime policy (*permitted right now*). No one of them substitutes for another.\n- **vs. [[Provenance]]** — provenance attaches origin / time / evidence to **facts**; identity attaches actor / subject to **actions**. Same traceability instinct, different object.\n- **vs. [[Abstention]] · [[CitationLock]]** — those constrain what the agent may **say** (honesty); identity constrains what it may **do** (authority).\n- **vs. sandboxing** — logical authority vs. physical isolation; a fully legitimate agent can still run somewhere that can write through the host kernel.\n- **vs. a permission list** — the list is an *input*; the mechanism is how it is issued, attenuated, revoked and independently verified.\n\n## Why It Matters\n- It is the axis [[Agent]] never had. Agent was defined as \"bounded by permissions, token budget, stopping condition\" — but *who grants that permission and how far it travels* was left unspecified. This page supplies it.\n- Without per-hop attenuation, the effective authority at the end of a delegation chain is **unknowable** — a few hops deep, nobody can state what the chain may do.\n- It is what makes [[HumanInTheLoop]] *enforceable* rather than aspirational: authority can be attenuated to zero (e.g. `pay_limit=0`), which forces the irreversible step back to a person.\n- Its concrete protocol instance is [[MCP]]'s authorization profile — see that page.\n\n## See Also\n- [[agent-identity]] — source\n- [[Agent]] — the entity being identified\n- [[HumanInTheLoop]] · [[ToolHallucination]] — the other two actor-side pages\n- [[MCP]] — the concrete authorization profile\n- [[Provenance]] · [[Abstention]] · [[CitationLock]] — the entity-side cluster this pairs with\n",

    "markdown": "---\ntitle: \"Agent Sandbox\"\ntype: concept\ntags: [agent-sandbox, execution-isolation, kubernetes, gvisor, kata, containment]\nsources: [agent-sandbox]\nlast_updated: 2026-09-26\n---\n\n# Agent Sandbox (执行隔离)\n\nA hard boundary around the agent's execution that **the agent itself cannot alter**: kernel-level isolation (gVisor / Kata / per-sandbox VM — not an ordinary container sharing the host kernel) plus declarative allow-lists (egress / filesystem / tool reach, declared with the environment). It does not ask *should this happen* — it guarantees *even if everything else fails, the blast radius is this large*.\n\n## Mechanism (per [[agent-sandbox]])\n- **Isolation below the kernel, not in the app layer** — the K8s upstream primitive delegates isolation to the pod spec's `RuntimeClass` (gVisor by default — syscall interception, no shared host kernel; Kata when a full guest kernel is needed; Alibaba uses a per-sandbox VM). Ordinary containers share the host kernel and **do not count**. *The HF intrusion case is exactly an app-layer allow-list being routed around.*\n- **Boundaries declared with the environment** — egress policy (exact-hostname allow-lists), filesystem and injection policies live in the `SandboxTemplate`, published and audited together with the environment (\"change the template, not the architecture\"). OpenAI's hosted sandbox has the same shape: egress three-state, `restricted` = 1–100 **exact** hostnames, **no wildcards**.\n- **Lifecycle is half the product** — `SandboxWarmPool` keeps N pre-warmed sandboxes (GKE: 300/sec/cluster, p90 200ms, 10–15× faster than cold start); idle agents suspend via pod snapshot with second-level resume; `SandboxClaim` allocates without touching template details. *Agent load is bursty + long-lived; without warm pools and suspend/resume the cost curve cannot support millions of agents.*\n- **It must exist independently of the permission system** — identity chains can narrow per hop and gates can stop irreversible actions, yet a **fully legitimate, fully approved** action can still run where it can write through the host kernel. Hence: **authority is not isolation**; the sandbox is an infrastructure property, not a permission field.\n\n## Boundary\n- **Not [[AgentIdentity]]** — logical authorisation vs physical containment; neither substitutes for the other.\n- **Not [[HumanInTheLoop]]** — different dimensions, not a pipeline order: the gate asks *may it act, now* (before); the sandbox bounds *what the action can touch* (during).\n- **Not [[ToolHallucination]]** — whether the called tool exists vs what its execution can reach.\n- **Not [[AgentHarness]]** — who orchestrates vs where it runs and what it can touch. OpenAI splits them as separate `Agent` / `Environment` objects; choose them separately.\n- **Not \"an ordinary container\"** — containers share the host kernel; that is precisely why `RuntimeClass` (gVisor/Kata) exists and why the K8s primitive is a distinct CRD on top of pods.\n\n## Why It Matters\n- **It completes the action-side chain.** `propose → resolve → authorize → gate → **execute**` — this page is the named `execute` leg that [[overview]] had listed as the missing third leg since 2026-09-24.\n- **As of 2026-09 it is standardised infrastructure.** One week saw five vendors converge: `kubernetes-sigs/agent-sandbox` into **SIG Apps** (upstream), **Google AX** open-sourced (Apache 2.0), **Alibaba Cloud Agent Sandbox** commercialised (100k instances/min, per-sandbox VM, E2B/K8s-API compatible), plus Docker Cloud Sandboxes and Nvidia OpenShell. When infrastructure absorbs a thing, it stops being optional.\n- **The strongest evidence it is necessary is a failure anatomy, not a product launch.** Hugging Face's 2026-07 intrusion post-mortem: the agent's SSRF was **correctly rejected** by an app-layer allow-list — then it **switched paths** (dataset-config file read → HDF5 external storage → pod secrets, plus Jinja2 template injection; entry via a zero-day in an *allowed* egress destination). Lesson: **a single layer of defence that denies one path does not close the surface.**\n- **Honest limits:** the upstream primitive is orchestration, not operations (node images, RuntimeClass, warm-pool capacity, FQDN allow-lists, GPU scheduling remain yours); it targets long-running stateful singletons, not fire-and-forget. Vendor capacity numbers (AX \"billions per cluster\", Alibaba, GKE 16×) are direction-grade, not verified capacity facts.\n\n## See Also\n- [[agent-sandbox]] — source\n- [[AgentIdentity]] · [[HumanInTheLoop]] · [[ToolHallucination]] — the decision mechanisms this page bounds the residual risk of\n- [[AgentHarness]] — the orchestration layer that plugs into a sandbox as its execution environment\n- [[Agent]] — whose action-side chain this page completes at `execute`\n- [[OpenAI]] — hosted-sandbox defaults as the cautionary default-values case\n",

    "markdown": "---\ntitle: \"Citation Lock\"\ntype: concept\ntags: [agent-memory, provenance, hallucination]\nsources: [agent-memory-provenance]\nlast_updated: 2026-09-16\n---\n\n# Citation Lock\n\nThe reading discipline in which an answer may cite only evidence its reader *actually opened* during this reasoning turn — making fabrication structurally impossible rather than merely discouraged.\n\n## Mechanism (per [[agent-memory-provenance]])\n- Every answer is read under a citation lock: the set of citable evidence is exactly the set the agent opened, not everything retrievable.\n- Combined with [[Provenance]] (every learned item carries origin/timestamp/evidence), fabrication is excluded by construction.\n- Knowledge updates are explicit: newer facts *supersede* older ones (an explicit `superseded_by` link), rather than silent overwrite or unbounded contradiction accretion.\n\n## Why It Matters\n- Turns \"don't hallucinate\" from a prompt-level plea into an architectural invariant.\n- Fixes the \"temporal contradiction\" failure: a flat vector store recalls both \"Adidas\" and \"Nike\" with no notion of which is current; a citation-locked, time-aware store returns only what is true now, with its source.\n- Pairs with [[Abstention]]: when the opened evidence set is empty, the correct output is \"I don't know\".\n\n## See Also\n- [[agent-memory-provenance]] — primary source\n- [[Provenance]] — the write-side constraint this complements\n- [[Abstention]] — the fallback behavior\n- [[LongTermMemory]] — the system enforcing it\n- [[Zep]] — vendor implementation on temporal context graphs\n",

    "markdown": "---\ntitle: \"Compaction\"\ntype: concept\ntags: [context-engineering, long-horizon, anthropic]\nsources: [context-engineering]\nlast_updated: 2026-09-16\n---\n\n# Compaction\n\nOne of the three long-horizon context techniques: summarize the conversation history and restart from the summary, preserving only architectural decisions, open questions, and the most recently accessed files.\n\n## Mechanism (per [[context-engineering]])\n- **Compaction** — summarize history → restart with a compacted context.\n- **Structured notes** — the agent writes progress to a file *outside* context (Claude Code's todo list is this pattern).\n- **Sub-agents** — a dedicated agent digs into a clean window and returns only ~1,000–2,000 high-density tokens to the main agent.\n\n## Why It Matters\n- Tasks spanning tens of minutes to hours cannot fit in any window; state must live outside the dialogue.\n- Improves *recall* first (don't drop the load-bearing decision), then iterate on *precision* (remove redundancy).\n- Over-compression can lose nuance, but doing nothing is worse — the agent simply fails at the limit.\n\n## See Also\n- [[context-engineering]] — primary source\n- [[ContextEngineering]] — parent discipline\n- [[Agent]] — the long-task consumer\n- [[LLMContext]] — the bounded resource being compacted\n",

    "markdown": "---\ntitle: \"Context Engineering\"\ntype: concept\ntags: [context-engineering, anthropic, prompt-engineering]\nsources: [context-engineering]\nlast_updated: 2026-09-16\n---\n\n# Context Engineering\n\nThe discipline of deciding, at every inference step, which tokens to place into the bounded context window — targeting the *minimal set of high-signal tokens* that produces the target result, rather than maximal volume.\n\n## Mechanism (per [[context-engineering]])\n1. **Layer by information lifespan** — stable boundaries once at start; current state reread right before key steps; large raw payloads kept as identifiers/addresses only.\n2. **Just-in-time retrieval** — replace pre-loading with on-demand fetch; the window holds references, not originals.\n3. **Each turn: trim + re-inject** — tool results return summaries + evidence pointers by default; old processed results are cleared near the limit.\n4. **Long-horizon techniques** — [[Compaction]], structured notes, sub-agents.\n\n## Why It Matters\n- The constraint is architectural: [[Transformer]] attention is an n² budget, so longer context spreads attention thinner.\n- Directly opposes \"bigger window = better\": [[ContextRot]] means effective capacity runs below the nominal ceiling.\n- Evidence: Anthropic cut Claude Code's system prompt by 80%+ with no measurable coding-eval loss; tool definitions dropped 77K → 8.7K tokens (−85%) while accuracy *rose* 79.5% → 88.1%.\n\n## See Also\n- [[context-engineering]] — primary source\n- [[ContextRot]] — the phenomenon it fights\n- [[LLMContext]] — the resource it manages\n- [[Compaction]] — its long-horizon technique\n- [[ProgressiveDisclosure]] & [[Skill]] — knowledge-loading instance of the same principle\n- [[Provenance]] — retrieved memory is only as useful as it is trustworthy\n",

    "markdown": "---\ntitle: \"Context Rot\"\ntype: concept\ntags: [context-engineering, degradation, anthropic]\nsources: [context-engineering]\nlast_updated: 2026-09-16\n---\n\n# Context Rot\n\nThe phenomenon in which a model's ability to accurately retrieve information from its context *continuously declines* as the number of tokens in the window rises. Named by Anthropic.\n\n## Mechanism (per [[context-engineering]])\n- Informally called \"context rot\" in Anthropic's engineering writing.\n- It is a *slope*, not a cliff: the model does not \"crash\" — it grows progressively more likely to misread long inputs.\n- Root cause is the same architectural fact as [[LLMContext]]: attention is a finite budget spread across n² token-pair relationships.\n\n## Why It Matters\n- Explains why \"open the window to 1M tokens and it fits everything\" is a false solution — fitting ≠ using.\n- Justifies [[ContextEngineering]] as active *curation* rather than passive accumulation.\n- Corroborated downstream by [[LongMemEval]]: long-context models lose 30–60% accuracy when forced to read full 115K-token histories.\n\n## See Also\n- [[context-engineering]] — primary source\n- [[ContextEngineering]] — the response to it\n- [[LLMContext]] — capacity ceiling vs. effective capacity\n- [[Transformer]] — n² attention cost as the root\n",

    "markdown": "---\ntitle: \"Human-in-the-Loop\"\ntype: concept\ntags: [human-in-the-loop, approval-gate, escalation, control]\nsources: [human-in-the-loop]\nlast_updated: 2026-09-24\n---\n\n# Human-in-the-Loop (Escalation Gate)\n\nGrading an agent's actions by **impact × reversibility** and inserting an auditable, timeout-aware checkpoint *before* irreversible or consequential writes. The operating rule the field is converging on: **\"read freely, keep writes human\"** — 读放开，写留人.\n\n## Mechanism (per [[human-in-the-loop]])\n1. **Grade the actions** — sort every action by impact × reversibility, then choose a supervision mode **per class**: human-in-the-loop (approve first) / human-on-the-loop (may veto) / fully automatic (sampled afterwards).\n2. **Split proposal from execution** — the model *proposes*; a **separate** path performs the side effect and must pass the gate. If the model can still call the side-effecting tool directly, the gate is decoration.\n3. **Deterministic gate in code / config** — action class, amount or quantity thresholds, confidence, input novelty. *A threshold that lives only in a policy document and is not embedded in the execution path is not a threshold.*\n4. **Persist before pausing; resume idempotently** — a review may take seconds or days, and the resuming process need not be the one that paused it. Measure **automation rate / override rate / escape rate / review latency**; without measurement the gate rots.\n\n## Boundary\n- **Not a confirmation dialog** — a real gate measures risk, can suspend execution, and supplies a **decision payload**: the inputs the agent saw, the action it intends, its reasoning, and three controls (approve / reject / modify-and-execute).\n- **Not a prompt-resident rule** — approval rules are *executable policy*; prompt-resident thresholds can be ignored, overridden or talked around.\n- **Not the model's self-restraint** — the sharpest seam in this cluster. [[Abstention]] and [[CitationLock]] have **the model** as their subject and govern **saying** (*honesty* mechanisms); the gate has **the system and the human** as its subject and governs **writing / paying / deleting** (*control* mechanism). Two layers, both required.\n- **Not a sandbox** — a sandbox constrains *what the agent can reach* (capability); a gate constrains *whether to ask first* (decision).\n- **Not \"more review = more accurate\"** — badly designed review imports **automation bias** plus latency and cost; HITL's benefit must be shown in the metrics, not assumed because \"someone is watching\".\n\n## Why It Matters\n- It answers a property unique to acting agents: unlike a chatbot, a wrong action is frequently **not recoverable** — a sent email, an executed payment, a deleted record. Model error rates can be low and the damage still lands before anyone notices.\n- It makes \"automatic\" and \"someone has a backstop\" compatible: the agent absorbs the bulk of the work, the human spends seconds on the one irreversible step — speed comes from *narrowing the decision scope*, not from removing oversight.\n- It produces the audit record \"who approved what, when, at which model version\" — [[Provenance]] applied to **decisions** rather than facts.\n- It closes the loop with [[AgentIdentity]]: attenuation sets the ceiling, the gate handles the remainder.\n- Its prerequisite is [[ToolHallucination]]: a gate can only adjudicate a call that resolves to a real tool.\n\n## See Also\n- [[human-in-the-loop]] — source\n- [[AgentIdentity]] — upstream: who acts, and how far authority reaches\n- [[ToolHallucination]] — upstream: the call must first resolve\n- [[Abstention]] · [[CitationLock]] — the honesty mechanisms this page is *not*\n- [[Agent]] — sharpens its \"not a fixed automation script\" boundary from *can it decide* to *may it act*\n- [[Provenance]] — the audit discipline this reuses for actions\n",

    "markdown": "---\ntitle: \"LLM Context\"\ntype: concept\ntags: [llm, context-window, transformer]\nsources: [llm-context]\nlast_updated: 2026-09-09\n---\n\n# LLM Context\n\nThe maximum number of tokens the model can simultaneously read and reference in a single inference pass.\n\n## Definition\nPer [[llm-context]] source: Sizing unit is **token** (BPE sub-word), not character.\n- English: ~1 token / word\n- Chinese: ~1.5–2 tokens / character\n\nThe window includes: system prompt + history + retrieved docs + reserved output, and must satisfy `total ≤ N tokens`.\n\n## Core Mechanism\n1. **BPE tokenization** — uniform processing across languages and out-of-vocab words\n2. **Positional encoding + self-attention** — O(n²) cost scaling (1000 → 1M relations, 10000 → 100M)\n3. **Truncation policy** — most APIs silently truncate oldest content rather than raising\n4. **Attention bias** — strong at start (system) + end (current); middle weakened (\"Lost in the Middle\")\n\n## Boundary\n- **Not = training knowledge** — parameters (long-term) ≠ context (this session)\n- **Not = bigger is better** — cost and latency scale with size; needs business-case ROI\n- **Not = character count** — use the target model's tokenizer\n\n## Practical Use\n| Use Large Window | Use RAG / Summary |\n|---|---|\n| Full-document cross-section QA | Sparse info, only fragments needed |\n| Long-chain Agent (multi-step state) | High-frequency, low-latency, low-cost |\n| Truncation-sensitive review | Acceptable chunk + merge for summarization |\n\n## See Also\n- [[ContextWindow]] — English-name redirect\n- [[Token]] — fundamental unit\n- [[Agent]] — bounded by context budget\n- [[Skill]] — progressive disclosure extends effective \"memory\"\n- [[Transformer]] — architecture whose n² cost sets the bound",

    "id": "concepts/LongTermMemory",
    "label": "Long-Term Memory",
    "type": "concept",
    "color": "#00BCD4",
    "path": "wiki\\concepts\\LongTermMemory.md",
    "markdown": "---\ntitle: \"Long-Term Memory\"\ntype: concept\ntags: [agent-memory, long-term-memory, memory-lifecycle]\nsources: [agent-memory-provenance, memory-lifecycle]\nlast_updated: 2026-10-09\n---\n\n# Long-Term Memory\n\nThe out-of-window storage layer that lets an agent carry state and knowledge across sessions and tool calls — the durable counterpart to the ephemeral [[LLMContext]] working set.\n\n## Mechanism (per [[agent-memory-provenance]])\n- Split by purpose rather than one general store; a proven design runs **three parallel memories**:\n  - **Episodic** — an event timeline making *when* and *what changed* first-class.\n  - **Associative** — an entity–event knowledge graph linking people/projects across sessions.\n  - **Semantic** — a curated, [[CitationLock|citation-locked]] Hierarchical Documentary Memory (HDM) of durable facts.\n- Retrieval: **intent gate** → **source router** → **three concurrent agentic searches** → one integrated answer.\n- Governed by [[Provenance]] (every item carries origin/timestamp/evidence) and [[Abstention]] (no sourced evidence ⇒ refuse).\n\n## Why It Matters\n- Resolves the tension [[ContextEngineering]] leaves open: the window cannot hold cross-session state, so state must live elsewhere and be re-injected.\n- Failure is *compounding*: a mistake written to durable memory recurs in every future plan; injection poisoning persists forever.\n- Benchmarks: [[AgentZeroMemory]] 95.60% on [[LongMemEval]]; naive long-context reading drops 30–60%.\n- ⚠️ **Read that 95.60% carefully** *(added 2026-10-09)*: it is a **given-the-right-memory / end-to-end** result. [[DyadMem]] shows frontier models are strong on Gold-Memory and **collapse on Full-Pipeline** (running capture/update/recall themselves), and Memora finds memory modules delivering only **marginal** gains with 94%/85% of pre-existing benchmark questions spanning ≤2 sessions. Not a contradiction — a **change of measurement target**. Stop quoting a single benchmark number as evidence that long-term memory works.\n\n## The other half of a memory's life (now sourced — *2026-09-24, banner cleared 2026-10-09*)\n\nThis page describes only the **first half** of a memory's life — how to store it, split it by purpose, and read it credibly. A memory also has a **second half**: decay scoring, merge, TTL expiry and compliant deletion. The framing question is not *\"can we store it?\"* but **\"when should we let it be forgotten?\"** — and, as of 2026-10-09, **who is entitled to decide**. That half now has its own pages: **[[MemoryGovernance]]** (the four actions · the three deciders · the four governance bottom lines) and **[[MemoryPoisoning]]** (the write-side attack surface).\n\n- **Retention is per-type, never one global TTL.** The three stores this page defines do not expire alike: *episodic* (high volume, timestamp-bound, expires first) → *semantic* (durable facts; the main **merge** target) → *procedural* (lowest volume, highest value, retained longest, hardest to prune).\n- **Deletion vs [[Provenance]] is the sharpest seam in this cluster.** Provenance requires every stored fact to carry origin / timestamp / evidence so it stays auditable; the right to erasure requires the *same* fact to be removed at the root. Deleting the fact **breaks the citation chain** — so the deletion itself must leave a trace (a receipt, a failure list, and a rollback-capable snapshot).\n- **The opposite failure mode also exists.** Unmanaged memory fails twice over: stale entries get re-injected as if current (a resolved dispute re-raised months later; a superseded runbook re-quoted), while [[Provenance]] without deletion fails on compliance. Memora's **FAMA** metric turns the first of these into a deductible score.\n- **Not [[Compaction]].** Compaction operates *inside* the window, per turn, and is lossy; lifecycle governance operates *outside* it, across sessions, on a day/week cadence, offline — it does not participate in the current inference turn.\n\n## See Also\n- [[agent-memory-provenance]] — primary source (the reading discipline)\n- [[memory-lifecycle]] — second source (lifecycle, forgetting, decision-rights)\n- [[MemoryGovernance]] · [[MemoryPoisoning]] — the second half of a memory's life\n- [[Provenance]] · [[CitationLock]] · [[Abstention]] — the reading discipline\n- [[DyadMem]] · [[LongMemEval]] — staged vs end-to-end memory benchmarks\n- [[MemGPT]] · [[AgentZeroMemory]] · [[Zep]] — systems\n- [[ContextEngineering]] — writes/reads are context-engineering decisions\n- [[LLMContext]] — the bounded working set it complements\n",
    "preview": "# Long-Term Memory The out-of-window storage layer that lets an agent carry state and knowledge across sessions and tool calls — the durable counterpart to the ephemeral [[LLMContext]] working set. ## Mechanism (per [[ag",

    "id": "concepts/MCP",
    "label": "MCP",
    "type": "concept",
    "color": "#E91E63",
    "path": "wiki\\concepts\\MCP.md",
    "markdown": "---\ntitle: \"MCP\"\ntype: concept\ntags: [anthropic, protocol, tools, mcp, stateless, authorization]\nsources: [skill, mcp-2026-07-28, agent-identity, tool-hallucination]\nlast_updated: 2026-09-24\n---\n\n# MCP (Model Context Protocol)\n\nA standard protocol for connecting LLMs to external data sources and tools, originated by [[Anthropic]]. As of the **2026-07-28 specification revision** it is a **stateless, request/response** protocol — see [[mcp-2026-07-28]].\n\n## Core primitives\nServers expose three primitives; each has `/list`, `/get`, and (for tools) `tools/call`:\n\n| Primitive | What it is |\n|---|---|\n| **Tools** | Executable functions the AI app can invoke (file ops, API calls, DB queries) |\n| **Resources** | Data sources providing context (file contents, DB records, API responses) |\n| **Prompts** | Reusable templates structuring interactions (system prompts, few-shot examples) |\n\nClients also expose primitives: **Elicitation** (server asks the user for input/confirmation).\n**Sampling** and **Logging** are **deprecated** as of 2026-07-28.\n\n## Protocol mechanics (post-2026-07-28)\n- **Stateless core** — no `initialize`/`initialized` handshake (SEP-2575), no `Mcp-Session-Id` (SEP-2567). Protocol version, client identity, and capabilities travel in `_meta` **on every request**; an optional `server/discover` RPC can fetch capabilities up front.\n- **Any instance can serve any request** — remote servers become plain HTTPS endpoints, scalable behind a round-robin load balancer with no shared session store.\n- **State, when needed, becomes an explicit handle** — a tool returns e.g. `basket_id`; the model threads it back as an argument. This is *visible* state the model can reason about, preferred over hidden transport state.\n- **Routing headers** — `Mcp-Method` and `Mcp-Name` are now required (SEP-2243) so gateways can route/meter without parsing bodies.\n- **Cacheable listings** — `ttlMs` + `cacheScope` on list/read results (SEP-2549).\n- **MRTR (SEP-2322)** — server→client requests (elicitation) use Multi Round-Trip Requests instead of a held-open stream: server returns `input_required`, client retries with `inputResponses`.\n\n## Authorization (per [[agent-identity]]) — added 2026-09-24\nMCP does not invent an identity model; it borrows the OAuth one, and the division of labour matters:\n- An MCP server on **HTTP transport must act as an OAuth 2.1 resource server** and implement **OAuth 2.0 Protected Resource Metadata (RFC 9728)** so clients can discover the authorization server.\n- **Clients must implement PKCE with S256**, and must **refuse to continue** when server metadata indicates PKCE is unsupported.\n- Consequence: the caller's identity is issued by an **external, dedicated authorization server** (short-lived, audience-restricted) — **not** asserted in MCP protocol messages. A self-declared `clientInfo` field can only ever mean \"it says it is X\". See [[AgentIdentity]] for why *identity / delegation / authorization / runtime policy* are four distinct things.\n- Note the interaction with the stateless revision above: statelessness removes *session* state, and the authorization profile is what carries *authority* instead — per request, verifiable.\n\n## Namespace merging hazard (per [[tool-hallucination]]) — added 2026-09-24\nComposing MCP servers is MCP's selling point, and it has a structural cost that the N×M framing hides:\n- When several servers are merged into **one namespace**, new failure modes appear that **no single registry can express** — name **collision** and **shadowing**. Two servers both exposing `search` is an ambiguity, not a naming quirk.\n- Merging therefore **adds a hallucination surface** rather than just adding tools: the source measures **154** hallucinations on a real merged MCP surface, including frontier models that were clean on a single-registry surface.\n- Practical rule: treat a namespace merge as a **review-worthy change**, and run a **closed-world resolution rung** (registry membership + signature check) *before* any permission gate on the dispatch path. See [[ToolHallucination]].\n\n## Boundary with Skill (per [[skill]])\n- **MCP** = \"connect the tool\" (standardizes the interface)\n- **Skill** = \"teach the model how to use the tool\" (organizes the workflow)\n- Often used together — MCP server + Skill that documents when to call which tool\n- Note: the 2026-07-28 revision changes MCP's *transport/state model*, **not** this boundary.\n\n## Why It Matters\n- Solves the \"N×M integrations\" problem (every LLM × every tool); a single MCP server serves multiple LLM clients.\n- Statelessness makes production scaling cheap: GitHub's MCP server removed Redis session storage and deep packet inspection; Manufact cut package size ~83% and gained ~25% speed.\n- Composable with [[ProgressiveDisclosure]] and [[ContextEngineering]] — a Skill can document an MCP tool without inlining its interface, and MCP's \"code execution\" mode keeps large tool payloads out of the context window.\n- Adoption scale: >10,000 servers in production by mid-2026; Tier 1 SDK downloads near half-a-billion/month.\n\n## See Also\n- [[Skill]] — complementary concept\n- [[mcp-2026-07-28]] — the stateless revision source\n- [[Anthropic]] — MCP origin\n- [[Agent]] — typical consumer that combines Skill + MCP\n- [[ContextEngineering]] — MCP code-execution mode is a context-engineering technique\n- [[OpenAI]] — adopted MCP in 2025\n- [[AgentIdentity]] — MCP's authorization profile is that concept's concrete instance\n- [[ToolHallucination]] — the failure mode that namespace merging *creates*; the resolution rung belongs on MCP's dispatch path\n",
    "preview": "# MCP (Model Context Protocol) A standard protocol for connecting LLMs to external data sources and tools, originated by [[Anthropic]]. As of the **2026-07-28 specification revision** it is a **stateless, request/respons",

    "id": "concepts/MemoryGovernance",
    "label": "Memory Governance",
    "type": "concept",
    "color": "#00BCD4",
    "path": "wiki\\concepts\\MemoryGovernance.md",
    "markdown": "---\ntitle: \"Memory Governance\"\ntype: concept\ntags: [agent-memory, memory-governance, memory-lifecycle, forgetting, learned-policy]\nsources: [memory-lifecycle, agent-memory-provenance]\nlast_updated: 2026-10-09\n---\n\n# Memory Governance\n\nThe discipline of treating an agent's durable memory **not as a store but as four actions that each fail differently** — Capture → Update → Recall → QA — and of answering, explicitly, the question every design otherwise answers by accident: **who holds the decision rights over what is written, when it is retrieved, and when it is deleted.**\n\nDistinguish it from the two neighbours it is most often confused with: [[LongTermMemory]] asks *where does durable state live and how is it read credibly*; Memory Governance asks *how does it change over time, and under whose authority.* The framing question is not “can we store it?” but **“when should we let it be forgotten — and who is allowed to decide?”**\n\n## The four actions (per [[memory-lifecycle]])\n| Action | What it does | Characteristic failure |\n|---|---|---|\n| **Capture** | Write new memories out of this session | Systematically **low recall** — the thing you changed last week never got written |\n| **Update** | Reconcile with the existing bank | **Coexistence instead of supersession** — two publication dates side by side, and the agent argues with itself |\n| **Recall** | Select entries that are still valid | **Incomplete recall** — one of three relevant memories comes back |\n| **QA** | Answer from the evidence | Answer looks right while the bank underneath is broken |\n\nThe reason to split them is diagnostic: an **end-to-end QA score stirs four different qualities together**. A correct answer can come out of a broken bank (lucky); a wrong answer tells you nothing about *which* stage to repair. [[DyadMem]] is the benchmark that makes the four stages separately measurable — and its headline result is a **measurement artefact, not a model ranking**: frontier models are strong **given gold memory**, and collapse once they must run the **full pipeline** themselves.\n\n## Forgetting is a capability, not a failure\n- **“Failed to forget” is now a deductible score.** Memora's **FAMA** = recall score − **stale-dependency penalty** (it explicitly penalises reliance on deleted or superseded memories). This turns *“the agent is quoting a superseded runbook as current”* from rhetoric into a number.\n- **The opposite failure must also be measured.** **Unsafe deletion** — removing a fact that is still under reference — is the other end, and DyadMem quantifies both.\n- **Retention is per-type, never one global TTL.** The three stores [[LongTermMemory]] defines do not expire alike: episodic (high volume, timestamp-bound, expires first) → semantic (durable; the main **merge** target) → procedural (lowest volume, highest value, retained longest, hardest to prune).\n- The sharpest seam: **deletion vs [[Provenance]]**. Provenance wants every fact to keep origin + time + evidence so it stays auditable; the right to erasure wants the same fact removed at the root. Deleting it **breaks the citation chain** — so the deletion itself must leave a trace (a receipt, a failure list, a rollback-capable snapshot).\n\n## The load-bearing variable: who decides\nThere are exactly three classes of decider, and picking one is the design decision that matters.\n\n| Decider | Write / retrieve / delete | Representative evidence | Core weakness |\n|---|---|---|---|\n| **Human-written rules** (today's default) | Thresholds, TTL, extraction counts, top-k hard-coded by an engineer | Layered memory (resident core + external retrieval + explicit forgetting policy) is the 2026 production form | Rules have **no judgement about what counts as stale**; every new domain needs re-tuning |\n| **Trained policy** (2026's new answer) | **ADD / UPDATE / DELETE / NOOP placed in the action space**, trained by RL on task-success reward | Memory-R1 (152 QA pairs ⇒ LoCoMo F1 **+68.9%** vs Mem0); ATMem (cost-aware reward + STR-GRPO; **76.6%** on AndroidWorld at ≈**1/29** the parameters) — six independent teams | **None deployed in production**; benchmarks exclude distribution shift and adversarial input; no single system owns write + retrieval + transformation |\n| **Attacker** (the decider nobody wants) | Write timing and content chosen by the injector | **PMPA** and **Darktrace** — see [[MemoryPoisoning]] | **The fix is vendor-side**, so the defending operator cannot deploy it |\n\n> **The rule that makes this page worth having: if memory has no owner, the owner slot does not stay vacant — it flows to whoever wants to exploit it.**\n\nThe middle row is why this is a *2026* page: the whole point of putting `DELETE` **into the action space** is that *“when is this stale?”* stops being a hand-tuned constant and becomes a learned decision that the task-success reward can correct.\n\n## The four governance bottom lines\n1. **Auditable** — every write / supersede / delete traceable like a git commit (who, when, on which source). This is [[Provenance]]'s instinct, applied to *change* rather than to *storage*.\n2. **Rollbackable** — deletion is a real, recorded, provable operation with a version history, not an invisible manual sweep of an undocumented store.\n3. **Permissioned** — **who may write to shared memory** managed as explicitly as database permissions (this is the *governance* half of the wiki's long-open “multi-agent shared memory” question).\n4. **Signature-verified** — against forged-history attacks the only root fix is **cryptographically signed model replies validated server-side every turn**. Until that ships, the local session-history store must be treated as a **security-sensitive file**.\n\nBottom lines 1–3 govern *your own mistakes*; bottom line 4 governs *someone else's malice*. **The reliability discipline and the security discipline merge at the memory layer** — which is why [[MemoryPoisoning]] is a decider in the table above rather than a separate topic.\n\n## Boundaries\n- **vs [[LongTermMemory]]** — that page is the **first half** of a memory's life (store it, split it by purpose, read it credibly); this page is the **second half** (update, forget, decide). Neither subsumes the other: you can have a perfectly sourced bank that is also a governance disaster.\n- **vs [[Compaction]]** — compaction is **inside** the window, per turn, lossy; governance is **outside** it, across sessions, offline, and does not participate in the current inference turn. Adjacent in one direction only: anything compaction drops that still matters should *land in long-term memory rather than evaporate*.\n- **vs [[Provenance]] / [[CitationLock]] / [[Abstention]]** — those are **entry and exit discipline** (writes carry origin; cite only what you opened; abstain without sourced evidence); this is the **whole lifecycle in between**. Not redundant: **a clean entry does not imply a clean lifecycle** — PMPA's payload arrives inside a benign document wearing legitimate provenance. (`ABSTAIN` on incomplete recall is this page *reusing* [[Abstention]], the way [[ContextEngineering]] reuses [[ProgressiveDisclosure]].)\n- **vs a bigger context window** — window is capacity; governance is structure and discipline. The counter-evidence is directional and specific: **Gold-Memory strong ⇒ Full-Pipeline collapse** means the bottleneck is the four actions, not the fit.\n- **vs [[ContextEngineering]]** — context engineering decides what goes on the desk **this step**; governance decides what survives **between** sessions.\n- **vs [[MemoryPoisoning]]** — poisoning is not *one more failure mode of a broken action*; it is **the third decider**, i.e. a claim of authority over the same three decisions. That is why it is treated as an owner, not as a bug.\n\n## Why It Matters\n- It reframes memory from a **personalisation feature** to a **reliability subsystem**: write one wrong entry and every future plan runs on bad input; poison one entry and the attack recurs in every later session.\n- It supplies the missing pass over [[LongTermMemory]]: the wiki could already say *where* memory lives and *how* to read it honestly; it could not yet say **how it expires, and who is entitled to expire it.**\n- It closes the “governance side” of the shared-memory question [[MultiAgent]] left open (verified ✅ vs speculation inside a team's shared memory; who may write what), and it makes the security and reliability disciplines meet on one object.\n\n## See Also\n- [[memory-lifecycle]] — primary source (2026-10-06 material, ingested 2026-10-09)\n- [[agent-memory-provenance]] — the entry/exit discipline it extends\n- [[LongTermMemory]] — the store whose second half this page governs\n- [[MemoryPoisoning]] — the third decider\n- [[Provenance]] · [[CitationLock]] · [[Abstention]] — adjacent reading discipline\n- [[Compaction]] · [[ContextEngineering]] · [[LLMContext]] — the in-window neighbours\n- [[DyadMem]] — the staged benchmark · [[LongMemEval]] — the end-to-end generation it corrects\n- [[MemGPT]] · [[AgentZeroMemory]] · [[Zep]] — the systems whose next question is governance\n- [[AgentSandbox]] — containment bounds what the agent can touch; governance bounds what it will remember\n",

    "id": "concepts/MemoryPoisoning",
    "label": "Memory Poisoning",
