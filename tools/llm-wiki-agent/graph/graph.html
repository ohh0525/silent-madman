[LongMemEval]].\n\n### How they connect\n\n```\nContext Engineering  ──manages/crops──▶  LLM Context Window\n        │                                   ▲\n        │ Progressive Disclosure is          │ supplies trusted\n        │ one instance of it                 │ long-term facts\n        ▼                                   │\n      Skill                              Long-Term Memory\n        │                                   ▲\n        └──────loads into────────────────────┘\n                     Agent reads/writes ─────┘\n```\n\nThe five-page story: **an Agent, bounded by a Context Window, uses Skills to load knowledge on demand (Progressive Disclosure); Context Engineering decides what belongs in that window each step; and provenance-aware Long-Term Memory lets the Agent remember across sessions — honestly.**\n\n## Cross-Cutting Themes\n- **Bounded context is the central constraint** — every concept traces back to a token / window / cost limit. [[ContextRot]] sharpens it: capacity ≠ effective capacity.\n- **\"On-demand loading\" is the dominant solution shape** — Skills (progressive disclosure), RAG, and memory retrieval all share it. [[ContextEngineering]] names it as a principle.\n- **Trust is the new frontier** — Cluster A assumed more/cleaner context; Cluster B adds that retrieved context must be *sourced and current* ([[Provenance]], [[CitationLock]], [[Abstention]]).\n- **Memory errors compound** — a mistake written to durable memory recurs; this reframes memory as a *reliability subsystem*, not a recall feature.\n- **[[Anthropic]] is the primary vendor** contributing this design vocabulary; [[OpenAI]] complements; memory systems now contribute [[AgentZeroMemory]], [[MemGPT]], [[Zep]].\n\n## Open Questions (suggested next sources)\n- A concrete RAG system case study (vector DB choice, chunking strategy, retrieval quality) — still open from 2026-09-09.\n- The MCP stateless revision (2026-07-28 spec) — [[MCP]] page may be outdated (flagged by the 2026-09-16 concept radar).\n- How [[ContextEngineering]] techniques are measured end-to-end (beyond single-provider claims) — needs an independent evaluation.\n- Multi-agent memory sharing and role-based access control on shared persistent memory.\n\n## Next Ingest Suggestions\n- `raw/papers/rag-survey.md` — RAG foundations\n- `raw/specs/mcp-2026-07-28.md` — MCP stateless revision\n- `raw/papers/context-engineering-eval.md` — independent context-engineering evaluation\n",

    "markdown": "---\ntitle: \"Agent\"\ntype: concept\ntags: [ai-agent, llm, autonomous-system]\nsources: [agent, skill]\nlast_updated: 2026-09-09\n---\n\n# Agent\n\nA software system driven by a large language model that autonomously decides which tools to call around a target, observes results, and loops until the task completes or control is yielded.\n\n## Definition\nPer [[agent]] source: Agent 是组织好的 LLM + 工具 + 记忆 + 循环。\n\n## Core Mechanism (from [[agent]])\n1. **Receive goal + context** — translate fuzzy intent into executable target\n2. **Reason next action** — ReAct / Chain-of-Thought pick tool + params\n3. **Execute tool + collect observation** — external executor does the work\n4. **Update state + judge stop** — merge observation, decide done or loop back\n\nA canonical pseudo-code:\n\n```\nwhile not done:\n    thought    = model.reason(goal, history)\n    if thought.is_final_answer: return thought.answer\n    tool_call  = model.choose_tool()\n    observation = execute(tool_call)\n    history.append((thought, tool_call, observation))\n```\n\n## Boundary\n- **Not a chatbot** — must dynamically control flow, not just answer questions\n- **Not a fixed automation script** — steps are auto-determined, not pre-encoded\n- **Not AGI** — bounded by permissions, token budget, stopping condition\n\n## Practical Use\n| Use Agent | Use Script |\n|---|---|\n| Steps cannot be enumerated in advance | Steps are fixed, repeated |\n| Need to adapt based on results | Millisecond-SLA hot paths |\n| Single failures acceptable via retry | Any failure is irreversible |\n\n## See Also\n- [[Skill]] — the packaging unit that turns general models into domain experts\n- [[LLMContext]] — Agent operations constrained by context window\n- [[ProgressiveDisclosure]] — load-on-demand that lets Agents use Skills within bounded context\n- [[ReAct]] — reasoning pattern used in Agent's step 2\n- [[Anthropic]] / [[OpenAI]] — primary vendors shaping Agent design vocabulary",

    "markdown": "---\ntitle: \"Compaction\"\ntype: concept\ntags: [context-engineering, long-horizon, anthropic]\nsources: [context-engineering]\nlast_updated: 2026-09-16\n---\n\n# Compaction\n\nOne of the three long-horizon context techniques: summarize the conversation history and restart from the summary, preserving only architectural decisions, open questions, and the most recently accessed files.\n\n## Mechanism (per [[context-engineering]])\n- **Compaction** — summarize history → restart with a compacted context.\n- **Structured notes** — the agent writes progress to a file *outside* context (Claude Code's todo list is this pattern).\n- **Sub-agents** — a dedicated agent digs into a clean window and returns only ~1,000–2,000 high-density tokens to the main agent.\n\n## Why It Matters\n- Tasks spanning tens of minutes to hours cannot fit in any window; state must live outside the dialogue.\n- Improves *recall* first (don't drop the load-bearing decision), then iterate on *precision* (remove redundancy).\n- Over-compression can lose nuance, but doing nothing is worse — the agent simply fails at the limit.\n\n## See Also\n- [[context-engineering]] — primary source\n- [[ContextEngineering]] — parent discipline\n- [[Agent]] — the long-task consumer\n- [[LLMContext]] — the bounded resource being compacted\n",

    "markdown": "---\ntitle: \"Context Engineering\"\ntype: concept\ntags: [context-engineering, anthropic, prompt-engineering]\nsources: [context-engineering]\nlast_updated: 2026-09-16\n---\n\n# Context Engineering\n\nThe discipline of deciding, at every inference step, which tokens to place into the bounded context window — targeting the *minimal set of high-signal tokens* that produces the target result, rather than maximal volume.\n\n## Mechanism (per [[context-engineering]])\n1. **Layer by information lifespan** — stable boundaries once at start; current state reread right before key steps; large raw payloads kept as identifiers/addresses only.\n2. **Just-in-time retrieval** — replace pre-loading with on-demand fetch; the window holds references, not originals.\n3. **Each turn: trim + re-inject** — tool results return summaries + evidence pointers by default; old processed results are cleared near the limit.\n4. **Long-horizon techniques** — [[Compaction]], structured notes, sub-agents.\n\n## Why It Matters\n- The constraint is architectural: [[Transformer]] attention is an n² budget, so longer context spreads attention thinner.\n- Directly opposes \"bigger window = better\": [[ContextRot]] means effective capacity runs below the nominal ceiling.\n- Evidence: Anthropic cut Claude Code's system prompt by 80%+ with no measurable coding-eval loss; tool definitions dropped 77K → 8.7K tokens (−85%) while accuracy *rose* 79.5% → 88.1%.\n\n## See Also\n- [[context-engineering]] — primary source\n- [[ContextRot]] — the phenomenon it fights\n- [[LLMContext]] — the resource it manages\n- [[Compaction]] — its long-horizon technique\n- [[ProgressiveDisclosure]] & [[Skill]] — knowledge-loading instance of the same principle\n- [[Provenance]] — retrieved memory is only as useful as it is trustworthy\n",

    "markdown": "---\ntitle: \"LLM Context\"\ntype: concept\ntags: [llm, context-window, transformer]\nsources: [llm-context]\nlast_updated: 2026-09-09\n---\n\n# LLM Context\n\nThe maximum number of tokens the model can simultaneously read and reference in a single inference pass.\n\n## Definition\nPer [[llm-context]] source: Sizing unit is **token** (BPE sub-word), not character.\n- English: ~1 token / word\n- Chinese: ~1.5–2 tokens / character\n\nThe window includes: system prompt + history + retrieved docs + reserved output, and must satisfy `total ≤ N tokens`.\n\n## Core Mechanism\n1. **BPE tokenization** — uniform processing across languages and out-of-vocab words\n2. **Positional encoding + self-attention** — O(n²) cost scaling (1000 → 1M relations, 10000 → 100M)\n3. **Truncation policy** — most APIs silently truncate oldest content rather than raising\n4. **Attention bias** — strong at start (system) + end (current); middle weakened (\"Lost in the Middle\")\n\n## Boundary\n- **Not = training knowledge** — parameters (long-term) ≠ context (this session)\n- **Not = bigger is better** — cost and latency scale with size; needs business-case ROI\n- **Not = character count** — use the target model's tokenizer\n\n## Practical Use\n| Use Large Window | Use RAG / Summary |\n|---|---|\n| Full-document cross-section QA | Sparse info, only fragments needed |\n| Long-chain Agent (multi-step state) | High-frequency, low-latency, low-cost |\n| Truncation-sensitive review | Acceptable chunk + merge for summarization |\n\n## See Also\n- [[ContextWindow]] — English-name redirect\n- [[Token]] — fundamental unit\n- [[Agent]] — bounded by context budget\n- [[Skill]] — progressive disclosure extends effective \"memory\"\n- [[Transformer]] — architecture whose n² cost sets the bound",

    "markdown": "---\ntitle: \"Long-Term Memory\"\ntype: concept\ntags: [agent-memory, long-term-memory]\nsources: [agent-memory-provenance]\nlast_updated: 2026-09-16\n---\n\n# Long-Term Memory\n\nThe out-of-window storage layer that lets an agent carry state and knowledge across sessions and tool calls — the durable counterpart to the ephemeral [[LLMContext]] working set.\n\n## Mechanism (per [[agent-memory-provenance]])\n- Split by purpose rather than one general store; a proven design runs **three parallel memories**:\n  - **Episodic** — an event timeline making *when* and *what changed* first-class.\n  - **Associative** — an entity–event knowledge graph linking people/projects across sessions.\n  - **Semantic** — a curated, [[CitationLock|citation-locked]] Hierarchical Documentary Memory (HDM) of durable facts.\n- Retrieval: **intent gate** → **source router** → **three concurrent agentic searches** → one integrated answer.\n- Governed by [[Provenance]] (every item carries origin/timestamp/evidence) and [[Abstention]] (no sourced evidence ⇒ refuse).\n\n## Why It Matters\n- Resolves the tension [[ContextEngineering]] leaves open: the window cannot hold cross-session state, so state must live elsewhere and be re-injected.\n- Failure is *compounding*: a mistake written to durable memory recurs in every future plan; injection poisoning persists forever.\n- Benchmarks: [[AgentZeroMemory]] 95.60% on [[LongMemEval]]; naive long-context reading drops 30–60%.\n\n## See Also\n- [[agent-memory-provenance]] — primary source\n- [[Provenance]] · [[CitationLock]] · [[Abstention]] — the reading discipline\n- [[MemGPT]] · [[AgentZeroMemory]] · [[Zep]] — systems\n- [[ContextEngineering]] — writes/reads are context-engineering decisions\n- [[LLMContext]] — the bounded working set it complements\n",

    "markdown": "---\ntitle: \"Provenance\"\ntype: concept\ntags: [agent-memory, provenance, reliability]\nsources: [agent-memory-provenance]\nlast_updated: 2026-09-16\n---\n\n# Provenance\n\nThe design constraint that every stored fact must carry its origin, timestamp, and an evidence pointer — so the system can always answer \"why is this believed?\" and can grade trust by *source*, not by *relevance alone*.\n\n## Mechanism (per [[agent-memory-provenance]])\n- A memory is not a string; it is a record answering: what claim is stored, which source produced it, is it fact/preference/inference, when observed or last verified, and what condition should replace or expire it.\n- Write-time gate: reject unknown or untrusted sources; grade trust by origin (`human` / `verified_tool` / `self_inferred`), and the agent does not get to fully trust its own guesses.\n- Read-time filter: drop expired / low-trust entries *before* they reach the context window; a retrieved memory without source and time metadata is \"just a persuasive sentence occupying expensive context\".\n\n## Why It Matters\n- Kills two compounding failure modes: **stale facts** (no TTL ⇒ presents a 3-week-old value with the same confidence as a 30-second-old one) and **unbounded growth** (append-only memory buries the right answer under near-duplicates).\n- Makes trust *meaningful*: when every record carries its source, retrieval filters can act on it; without it, trust becomes uniform and therefore meaningless.\n- Directly matches the silent-madman repo's own \"人工核查承诺\" instinct — nothing enters as fact without a traceable source.\n\n## See Also\n- [[agent-memory-provenance]] — primary source\n- [[LongTermMemory]] — the store that carries provenance\n- [[CitationLock]] — the read-side companion\n- [[Abstention]] — what happens when provenance is absent\n",

    "markdown": "---\ntitle: \"Skill\"\ntype: concept\ntags: [anthropic, skill, progressive-disclosure, design-pattern]\nsources: [skill]\nlast_updated: 2026-09-09\n---\n\n# Skill\n\nAn organized folder of instructions, scripts, and resources that Claude loads on demand when a task is relevant — turning a general model into a domain expert.\n\n## Definition\nPer [[skill]] source: Same Skill folder usable across Claude app / Claude Code / API / Agent SDK. Released as an open standard after 2025-12.\n\n## Core Mechanism\n- **Progressive disclosure (3 layers)**:\n  - Layer 1 — YAML metadata (name + description) always in system prompt\n  - Layer 2 — SKILL.md body loaded when task relevant\n  - Layer 3 — scripts and referenced assets loaded on demand\n- **Auto relevance check** — Claude scans metadata descriptions each turn; user doesn't \"pick\"\n- **Code as first-class** — scripts allow deterministic operations (sort, render PDF, generate chart)\n- **Cross-product portability** — same Skill works in multiple products\n\n## Boundary\n- **Not = prompt template** — template is per-conversation; Skill is cross-conversation, version-controlled, multi-product-shared\n- **Not = fine-tuning** — Skill changes context, not model parameters\n- **Not = MCP** — MCP = \"connect the tool\" (interface standard); Skill = \"teach the model how to use the tool\"\n\n## Practical Use\n| Use Skill | Use Prompt / Project |\n|---|---|\n| Cross-team / multi-product domain workflow | One-off, temporary input requirement |\n| Complex tasks needing executable scripts | Static reference knowledge (glossaries) |\n| Dynamic relevance activation | Always-on rules for every session |\n\n## See Also\n- [[Agent]] — Skill is the unit that empowers Agents\n- [[ProgressiveDisclosure]] — load-on-demand mechanism\n- [[LLMContext]] — Skills operate within bounded context\n- [[MCP]] — complementary tool-connection standard\n- [[Anthropic]] — Skill is an Anthropic product feature",

    "id": "sources/agent-memory-provenance",
    "label": "带溯源的智能体长期记忆(Provenance-Aware Memory)",
    "type": "source",

    "path": "wiki\\sources\\agent-memory-provenance.md",
    "markdown": "---\ntitle: \"带溯源的智能体长期记忆(Provenance-Aware Memory)\"\ntype: source\ntags: [concept-learning, agent-memory, provenance, long-term-memory, abstention, silent-madman]\ndate: 2026-09-16\nsource_file: raw/learning-materials/agent-memory-provenance.html\nsources: [agent-memory-provenance]\nlast_updated: 2026-09-16\n---\n\n## Summary\nA concept-learning HTML document (7-section format) generated by the silent-madman concept-explainer skill on 2026-09-16. Defines provenance-aware long-term memory as the design discipline in which every stored fact carries its origin, timestamp, and evidence pointer, and every answer is produced under a *citation lock* — it may cite only evidence the reader actually opened. Fabrication is structurally excluded and the system abstains rather than guesses. Anchored by the Agent Zero Memory paper (arXiv:2608.29606) and the LongMemEval benchmark.\n\n## Key Claims\n- A single general-purpose memory store (vector index or knowledge graph) inherits that structure's blind spots; better to run **three parallel purpose-built memories**: episodic (event timeline), associative (entity–event graph), and semantic (citation-locked Hierarchical Documentary Memory, HDM).\n- Retrieval runs an **intent gate** (self-contained turns add no latency) → **source router** → **three concurrent agentic searches** (hybrid embedding + lexical, agent-controlled filters), integrated into one answer with a single confidence.\n- **Reading discipline:** every learned item is a provenanced item (origin + timestamp + evidence pointer); every answer is read under a citation lock, so it may cite only evidence actually opened → fabrication is structurally impossible, and the system abstains instead of guessing.\n- Memory errors **compound**: a one-turn hallucination is transient, but a mistake *written* to durable memory becomes a recurring input to every future plan. Prompt-injection poisoning persists across all future sessions (\"one write, permanent compromise\").\n- Memory writes are **side effects with blast radius** — they should get the same engineering discipline as any external action (source grading, TTL, validation on write, filtering on read, and a real, loggable \"forget\").\n- Quantitative: Agent Zero Memory scores **95.60%** on LongMemEval and **93.60%** on LoCoMo (best prior +0.73 / +1.10); across 8 LLM backbones accuracy varies only **3.4 points** while per-query cost varies **~30×** — the signature of *memory-driven, not model-driven, quality*.\n- LongMemEval shows naive long-context reading of full 115K-token histories drops **30%–60%** accuracy vs. evidence-only; commercial assistants reach only **30%–70%**.\n\n## Key Quotes\n> \"带溯源的长期记忆不是『记得更多』，而是『记得更诚实』——每条事实都带着来源与时间，每次作答都必须引用真正打开过的证据；当没有依据时，正确的输出是『我不知道』。\"\n> \"虚拟内存若没有溯源，只是让坏状态优雅地规模化。\"\n\n## Connections\n- [[AgentZeroMemory]] — the system this source's core design comes from\n- [[LongMemEval]] — the benchmark providing the accuracy-drop evidence\n- [[MemGPT]] — the OS-tiering ancestor of tiered memory\n- [[LongTermMemory]] — concept page this source primarily informs\n- [[Provenance]] — the central design constraint\n- [[CitationLock]] — the reading-discipline mechanism\n- [[Abstention]] — the correct behavior when no sourced evidence exists\n- [[Zep]] — vendor framing: memory (provenance + temporality) as a first-line hallucination control\n- [[LLMContext]] — long-term memory is the out-of-window store that context engineering manages\n- [[ContextEngineering]] — governs when/what to write and how to re-inject retrieved memories\n\n## Contradictions\n- Refines [[LLMContext]]'s \"on-demand loading is the dominant solution\": the source argues on-demand retrieval is necessary but *insufficient* — without provenance and citation locks, a vector store merely scales bad state. This is complementary, not contradictory.\n",

    "markdown": "---\ntitle: \"AI Agent(智能体)\"\ntype: source\ntags: [concept-learning, ai-agent, llm, silent-madman]\ndate: 2026-09-05\nsource_file: raw/learning-materials/agent.html\nsources: [agent]\nlast_updated: 2026-09-09\n---\n\n## Summary\nA concept-learning HTML document (7-section format: 一句话定义 / 个人解释 / 核心机制 / 应用场景 / 边界辨析 / 来源链接 / 一句话回顾) generated by the silent-madman concept-explainer skill on 2026-09-05. Defines AI Agent as a software system driven by an LLM that autonomously decides which tools to call around a target, observes results, and loops until the task completes or control is yielded.\n\n## Key Claims\n- Agent is not a new algorithm but an *organization* of (reasoning model + tool calls + memory + loop).\n- The core mechanism is a four-step loop: receive goal + context → reason next action → execute tool + collect observation → update state + judge whether to stop.\n- Common misconception: \"attaching a tool makes an Agent\" — Anthropic and OpenAI both require the model to *dynamically* control the execution flow.\n- Practical scoping: use Agents only when steps cannot be enumerated in advance; use scripts otherwise.\n\n## Key Quotes\n> \"Agent 不是某种新算法,而是把『会推理的模型 + 可以调用的工具 + 一个会停下来的循环』组织在一起,让系统能围绕目标自己挑路径。\"\n\n## Connections\n- [[Anthropic]] — primary source for Agent definition and Agent Skills design\n- [[OpenAI]] — complementary view on Agent Skills\n- [[Agent]] — concept page this source primarily informs\n- [[LLMContext]] — Agent operations constrained by context window budget\n- [[Skill]] — Skill is the packaging unit that empowers Agents\n- [[ReAct]] — reasoning pattern used in step 2 of the Agent loop\n\n## Contradictions\n- None detected at ingest time.",

    "markdown": "---\ntitle: \"上下文工程(Context Engineering)\"\ntype: source\ntags: [concept-learning, context-engineering, context-rot, anthropic, silent-madman]\ndate: 2026-09-16\nsource_file: raw/learning-materials/context-engineering.html\nsources: [context-engineering]\nlast_updated: 2026-09-16\n---\n\n## Summary\nA concept-learning HTML document (7-section format) generated by the silent-madman concept-explainer skill on 2026-09-16. Defines Context Engineering as the discipline of deciding, at every inference step, which tokens to place into the bounded context window — targeting the *minimal set of high-signal tokens* rather than maximal volume. Positions it as the natural evolution of prompt engineering, grounded in the observation that retrieval accuracy degrades (context rot) as token count grows.\n\n## Key Claims\n- Context engineering ≠ prompt engineering: the former governs the composition of *all* tokens in a turn (iterative, per-step), the latter only how a single instruction is phrased (one-shot, discrete).\n- **context rot** — as token count in the window rises, the model's ability to retrieve information accurately declines continuously (a slope, not a cliff). Window size is a capacity ceiling, not effective capacity.\n- \"Bigger window solves everything\" is a false solution: the constraint is architectural — Transformer self-attention costs n² in token-pair relationships, so attention is a finite budget.\n- Long-horizon tasks survive on three techniques: **compaction** (summarize history and restart), **structured notes** (write state to files outside context; e.g. Claude Code's todo list), and **sub-agents** (isolated clean windows that return only 1,000–2,000 high-density tokens).\n- Just-in-time retrieval replaces pre-loading: keep identifiers/addresses instead of raw payloads; reread authoritative state right before key steps.\n- Anthropic removed 80%+ of Claude Code's system prompt with no measurable coding-eval loss — *less* context, *better* results.\n\n## Key Quotes\n> \"上下文工程是在模型推理的每一步，决定往有限的上下文窗口里放入哪些 token 的一整套取舍方法——目标是找到能产出目标结果的「最小高信号 token 集合」。\"\n> \"不是加了新东西让它变强，而是拿掉了旧东西。\"\n\n## Connections\n- [[ContextEngineering]] — concept page this source primarily informs\n- [[ContextRot]] — the degradation phenomenon this source names\n- [[LLMContext]] — the resource being engineered; capacity ≠ effective capacity\n- [[Compaction]] — one of the three long-horizon techniques\n- [[Skill]] — progressive disclosure is a concrete instance of context engineering\n- [[ProgressiveDisclosure]] — the load-on-demand pattern applied to knowledge\n- [[Transformer]] — n² attention cost is the architectural root of the constraint\n- [[Anthropic]] — primary source (engineering blog + Claude product posts)\n- [[Agent]] — the primary consumer of these techniques in long tasks\n\n## Contradictions\n- None detected. Complements [[LLMContext]] (adds the *methodology layer* on top of the physical resource) and sharpens [[ProgressiveDisclosure]] (reframes it as an instance of a broader principle).\n",

    "markdown": "---\ntitle: \"LLM Context Window(上下文窗口)\"\ntype: source\ntags: [concept-learning, llm, context-window, silent-madman]\ndate: 2026-09-05\nsource_file: raw/learning-materials/llm-context.html\nsources: [llm-context]\nlast_updated: 2026-09-09\n---\n\n## Summary\nA concept-learning HTML document generated by silent-madman's concept-explainer skill on 2026-09-05. Defines the LLM context window as the maximum number of tokens the model can simultaneously read and reference in a single inference pass. The mechanism covers BPE tokenization, positional encoding + self-attention, total length judgment + truncation, and attention-weight shifting (Lost in the Middle).\n\n## Key Claims\n- Context window is the model's \"short-term memory desktop\" — sized in tokens, not characters (Chinese characters average 1.5–2 tokens each).\n- Self-attention cost grows as n²; 1000 tokens → 1M pair-wise relations, 10000 tokens → 100M.\n- Most commercial APIs *silently truncate* on overflow rather than raising an error — explaining the common \"AI amnesia\" experience.\n- \"Lost in the Middle\": even within window, the model attends strongest to system prompt + current question; middle content gets weaker attention.\n\n## Key Quotes\n> \"上下文窗口是模型的『短期记忆』办公桌——尺寸按 token 计算,受注意力平方成本硬约束,决定了模型这一轮能看见什么、记不得什么。\"\n\n## Connections\n- [[Anthropic]] — context-engineering + Skills 三级披露 designed around context window constraints\n- [[LLMContext]] — concept page this source primarily informs\n- [[ContextWindow]] — alternative naming for the same concept\n- [[Token]] — fundamental unit of context accounting\n- [[Agent]] — Agent operations are bounded by context budget\n- [[Transformer]] — underlying architecture whose n² cost sets the window bound\n\n## Contradictions\n- None detected at ingest time.",

    "markdown": "---\ntitle: \"Skill(技能)\"\ntype: source\ntags: [concept-learning, anthropic, skill, progressive-disclosure, silent-madman]\ndate: 2026-09-05\nsource_file: raw/learning-materials/skill.html\nsources: [skill]\nlast_updated: 2026-09-09\n---\n\n## Summary\nA concept-learning HTML document generated by silent-madman's concept-explainer skill on 2026-09-05. Defines Skill as an organized folder of instructions, scripts, and resources that Claude loads on demand when a task is relevant — turning a general model into a domain expert. The core mechanism is *progressive disclosure* (YAML metadata → SKILL.md body → referenced scripts/assets), which fits unlimited expertise into a bounded context window.\n\n## Key Claims\n- Skill is not a prompt template — it is a cross-conversation, version-controlled, multi-product-shared directory.\n- Three-layer progressive disclosure: (1) YAML metadata always in system prompt, (2) SKILL.md body loaded when relevant, (3) scripts/assets loaded on demand.\n- Same Skill folder works across Claude app, Claude Code, API, Agent SDK; released as an open standard after 2025-12.\n- Skill is *not* MCP: Skill teaches the model how to use tools; MCP standardizes the tool connection itself.\n\n## Key Quotes\n> \"Skill 不是『让模型变聪明』,而是『把组织经验打包成可按需加载的目录』,用渐进式披露在有限的上下文里装下无限的专业知识。\"\n\n## Connections\n- [[Anthropic]] — Skill is an Anthropic product feature\n- [[Skill]] — concept page this source primarily informs\n- [[ProgressiveDisclosure]] — the load-on-demand mechanism that makes Skills work\n- [[LLMContext]] — Skills operate within bounded context via progressive disclosure\n- [[Agent]] — Skill is the unit that empowers Agents\n- [[MCP]] — complementary tool-connection standard\n\n## Contradictions\n- None detected at ingest time.",

  id: edge.id || `${edge.from}->${edge.to}:${edge.type || "INFERRED"}`,
}));
const nodes = new vis.DataSet(originalNodes);
const edges = new vis.DataSet(originalEdges);
const adjacency = new Map();
const searchInput = document.getElementById("search");
const stats = document.getElementById("stats");
const controls = {
  extracted: document.getElementById("cb-extracted"),
  inferred: document.getElementById("cb-inferred"),
  ambiguous: document.getElementById("cb-ambiguous"),
  confSlider: document.getElementById("conf-slider"),
  confValue: document.getElementById("conf-val"),
};
const nodeMap = new Map(originalNodes.map(node => [node.id, node]));
let activeNodeId = null;

function hexToRgba(color, alpha) {
  if (!color) return `rgba(255, 255, 255, ${alpha})`;
  const normalized = color.replace("#", "");
  const value = normalized.length === 3
    ? normalized.split("").map(ch => ch + ch).join("")
    : normalized;
  const intValue = Number.parseInt(value, 16);
  const r = (intValue >> 16) & 255;
  const g = (intValue >> 8) & 255;
  const b = intValue & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function escapeHtml(text) {
  return (text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function stripFrontmatter(markdown) {
  return (markdown || "").replace(/^---\n[\s\S]*?\n---\n?/, "");
}

function renderInlineMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink">[[$1]]</span>');
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return html;
}

function renderMarkdown(markdown) {
  const lines = stripFrontmatter(markdown).split(/\r?\n/);
  const html = [];
  let paragraph = [];
  let listType = null;
  let listItems = [];
  let quoteLines = [];
  let inCodeBlock = false;
  let codeLines = [];

  function flushParagraph() {
    if (!paragraph.length) return;
    html.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
    paragraph = [];
  }

  function flushList() {
    if (!listType || !listItems.length) return;
    const items = listItems.map(item => `<li>${renderInlineMarkdown(item)}</li>`).join("");
    html.push(`<${listType}>${items}</${listType}>`);
    listType = null;
    listItems = [];
  }

  function flushQuote() {
    if (!quoteLines.length) return;
    html.push(`<blockquote>${quoteLines.map(line => renderInlineMarkdown(line)).join("<br>")}</blockquote>`);
    quoteLines = [];
  }

  function flushCode() {
    if (!codeLines.length) {
      html.push("<pre><code></code></pre>");
      return;
    }
    html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
    codeLines = [];
  }

  for (const rawLine of lines) {
    const line = rawLine.replace(/\t/g, "    ");
    const trimmed = line.trim();

    if (trimmed.startsWith("```")) {
      flushParagraph();
      flushList();
      flushQuote();
      if (inCodeBlock) {
        flushCode();
        inCodeBlock = false;
      } else {
        inCodeBlock = true;
      }
      continue;
    }

    if (inCodeBlock) {
      codeLines.push(rawLine);
      continue;
    }

    if (!trimmed) {
      flushParagraph();
      flushList();
      flushQuote();
      continue;
    }

    const headingMatch = trimmed.match(/^(#(1, 6))\s+(.+)$/);
    if (headingMatch) {
      flushParagraph();
      flushList();
      flushQuote();
      const level = headingMatch[1].length;
      html.push(`<h${level}>${renderInlineMarkdown(headingMatch[2])}</h${level}>`);
      continue;
    }

    if (/^(-(3,)|\*(3,))$/.test(trimmed)) {
      flushParagraph();
      flushList();
      flushQuote();
      html.push("<hr>");
      continue;
    }

    const quoteMatch = trimmed.match(/^>\s?(.*)$/);
    if (quoteMatch) {
      flushParagraph();
      flushList();
      quoteLines.push(quoteMatch[1]);
      continue;
    }
    flushQuote();

    const unorderedMatch = trimmed.match(/^[-*]\s+(.+)$/);
    if (unorderedMatch) {
      flushParagraph();
      if (listType && listType !== "ul") flushList();
      listType = "ul";
      listItems.push(unorderedMatch[1]);
      continue;
    }

    const orderedMatch = trimmed.match(/^\d+\.\s+(.+)$/);
    if (orderedMatch) {
      flushParagraph();
      if (listType && listType !== "ol") flushList();
      listType = "ol";
      listItems.push(orderedMatch[1]);
      continue;
    }

    flushList();
    paragraph.push(trimmed);
  }

  if (inCodeBlock) flushCode();
  flushParagraph();
  flushList();
  flushQuote();
  return html.join("");
}

function rebuildAdjacency(filteredEdges) {
  adjacency.clear();
  for (const node of originalNodes) {
    adjacency.set(node.id, new Set());
  }
  for (const edge of filteredEdges) {
    if (!adjacency.has(edge.from)) adjacency.set(edge.from, new Set());
    if (!adjacency.has(edge.to)) adjacency.set(edge.to, new Set());
    adjacency.get(edge.from).add(edge.to);
    adjacency.get(edge.to).add(edge.from);
  }
}

function currentEdgeState() {
  const minConf = parseInt(controls.confSlider.value, 10) / 100;
  controls.confValue.textContent = minConf.toFixed(2);
  return {
    showExtracted: controls.extracted.checked,
    showInferred: controls.inferred.checked,
    showAmbiguous: controls.ambiguous.checked,
    minConf,
  };
}

function passesEdgeFilters(edge, edgeState) {
  const typeOk = (edge.type === "EXTRACTED" && edgeState.showExtracted)
    || (edge.type === "INFERRED" && edgeState.showInferred)
    || (edge.type === "AMBIGUOUS" && edgeState.showAmbiguous);
  const confOk = (edge.confidence ?? 1.0) >= edgeState.minConf;
  return typeOk && confOk;
}

function searchNodes(q) {
  applyFilters(q, activeNodeId);
}

function clearSelection() {
  activeNodeId = null;
  closeDrawer();
  applyFilters(searchInput.value, null);
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
}

function openDrawer(node, relatedIds) {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer-title").textContent = node.label;
  const communityText = Number.isInteger(node.group) && node.group >= 0 ? ` · community ${node.group}` : "";
  document.getElementById("drawer-meta").textContent = `${node.type}${communityText}`;
  document.getElementById("drawer-path").textContent = node.path;
  document.getElementById("drawer-preview").textContent = node.preview || "";
  document.getElementById("drawer-markdown").innerHTML = renderMarkdown(node.markdown || "");

  const relatedList = document.getElementById("drawer-related-list");
  relatedList.innerHTML = "";
  const relatedNodes = originalNodes
    .filter(item => relatedIds.has(item.id) && item.id !== node.id)
    .sort((a, b) => a.label.localeCompare(b.label));

  if (relatedNodes.length === 0) {
    const empty = document.createElement("span");
    empty.textContent = "No directly connected nodes";
    relatedList.appendChild(empty);
    return;
  }

  for (const related of relatedNodes) {
    const chip = document.createElement("button");
    chip.className = "related-chip";
    chip.textContent = related.label;
    chip.onclick = () => focusNode(related.id);
    relatedList.appendChild(chip);
  }
}

function applyFilters(query = searchInput.value, selectedNodeId = activeNodeId) {
  const lower = (query || "").trim().toLowerCase();
  const edgeState = currentEdgeState();
  const filteredEdges = originalEdges.filter(edge => passesEdgeFilters(edge, edgeState));
  rebuildAdjacency(filteredEdges);

  const relatedIds = selectedNodeId
    ? new Set([selectedNodeId, ...(adjacency.get(selectedNodeId) || [])])
    : null;
  const filteredNodeIds = new Set();
  for (const edge of filteredEdges) {
    filteredNodeIds.add(edge.from);
    filteredNodeIds.add(edge.to);
  }

  let visibleNodeCount = 0;
  const nodeUpdates = originalNodes.map(node => {
    const matchesSearch = !lower || node.label.toLowerCase().includes(lower);
    const isActive = selectedNodeId === node.id;
    const isConnected = filteredNodeIds.has(node.id);
    const isRelated = !relatedIds || relatedIds.has(node.id);
    const hidden = !selectedNodeId && !lower && !isConnected;
    const emphasized = matchesSearch && isRelated && (isConnected || !!lower || isActive);

    if (!hidden) {
      visibleNodeCount += 1;
    }

    return {
      id: node.id,
      hidden,
      color: {
        background: emphasized ? node.color : hexToRgba(node.color, hidden ? 0.05 : 0.14),
        border: emphasized ? hexToRgba(node.color, 0.96) : hexToRgba(node.color, hidden ? 0.08 : 0.22),
        highlight: { background: node.color, border: hexToRgba(node.color, 1) },
        hover: { background: node.color, border: hexToRgba(node.color, 1) },
      },
      font: {
        color: emphasized ? "#f2f3f8" : hidden ? "rgba(242,243,248,0.08)" : "rgba(242,243,248,0.2)",
      },
      borderWidth: isActive ? 5 : 2,
      size: isActive ? 18 : 12,
    };
  });

  const edgeUpdates = originalEdges.map(edge => {
    const enabled = passesEdgeFilters(edge, edgeState);
    if (!enabled) {
      return { id: edge.id, hidden: true };
    }

    const matchesSearch = !lower
      || nodeMap.get(edge.from)?.label.toLowerCase().includes(lower)
      || nodeMap.get(edge.to)?.label.toLowerCase().includes(lower);
    const isRelated = !relatedIds || relatedIds.has(edge.from) || relatedIds.has(edge.to);
    const touchesActive = !!selectedNodeId && (edge.from === selectedNodeId || edge.to === selectedNodeId);
    const emphasized = matchesSearch && isRelated;

    return {
      id: edge.id,
      hidden: false,
      width: touchesActive ? 2.8 : emphasized ? 1.2 : 0.6,
      color: emphasized ? edge.color : hexToRgba(edge.color, 0.08),
    };
  });

  nodes.update(nodeUpdates);
  edges.update(edgeUpdates);

  if (selectedNodeId) {
    const activeNode = nodeMap.get(selectedNodeId);
    if (activeNode) {
      openDrawer(activeNode, relatedIds || new Set([selectedNodeId]));
    }
  }

  const focusSuffix = selectedNodeId && nodeMap.get(selectedNodeId)
    ? ` · focused: ${nodeMap.get(selectedNodeId).label}`
    : "";
  stats.textContent = `${visibleNodeCount} nodes · ${filteredEdges.length} edges${focusSuffix}`;
}

const container = document.getElementById("graph");

// Adaptive physics based on graph size
const nodeCount = originalNodes.length;
const gravConst = nodeCount > 80 ? -8000 : nodeCount > 30 ? -5000 : -2000;
const springLen = nodeCount > 80 ? 250 : nodeCount > 30 ? 200 : 150;

const network = new vis.Network(container, { nodes, edges }, {
  nodes: {
    shape: "dot",
    font: { color: "#ddd", size: 12, strokeWidth: 3, strokeColor: "#111" },
    borderWidth: 1.5,
    scaling: {
      min: 8,
      max: 40,
      label: { enabled: true, min: 10, max: 20, drawThreshold: 6, maxVisible: 24 },
    },
  },
  edges: {
    width: 0.8,
    smooth: { type: "continuous" },
    arrows: { to: { enabled: true, scaleFactor: 0.4 } },
    color: { inherit: false },
    hoverWidth: 2,
  },
  physics: {
    stabilization: { iterations: 250, updateInterval: 25, fit: true },
    barnesHut: { gravitationalConstant: gravConst, springLength: springLen, springConstant: 0.02, damping: 0.15 },
    minVelocity: 0.75,
  },
  interaction: { hover: true, tooltipDelay: 150, hideEdgesOnDrag: true, hideEdgesOnZoom: true },
});

// Ensure the graph fits the viewport after physics stabilization
network.once("stabilizationIterationsDone", function () {
  network.fit({ animation: { duration: 400, easingFunction: "easeInOutQuad" } });
});

function focusNode(nodeId) {
  activeNodeId = nodeId;
  applyFilters(searchInput.value, nodeId);
  const node = nodeMap.get(nodeId) || nodes.get(nodeId);
  const relatedIds = new Set([nodeId, ...(adjacency.get(nodeId) || [])]);
  openDrawer(node, relatedIds);
  network.focus(nodeId, {
    scale: 1.1,
    animation: { duration: 300, easingFunction: "easeInOutQuad" },
  });
}

network.on("click", params => {
  if (params.nodes.length > 0) {
    focusNode(params.nodes[0]);
  } else {
    clearSelection();
  }
});

applyFilters();
</script>
</body>
</html>
