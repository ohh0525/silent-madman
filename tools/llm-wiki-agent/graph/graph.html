ory tool (Anthropic) all share this pattern.\n- **[[Anthropic]] is the primary vendor contributing this design vocabulary**; [[OpenAI]] provides complementary framing.\n- **Memory ≠ context window ≠ training knowledge** — the three are easy to confuse but operate on different axes.\n\n## Open Questions (suggested next sources)\n- A concrete RAG system case study (vector DB choice, chunking strategy, retrieval quality)\n- MemGPT or Anthropic memory tool reference (for OS-style tiered memory)\n- LangChain's memory module deep-dive (for practical patterns across 6 memory types)\n- How Agent memory system (vector / summary / KV trade-offs) interacts with Skill loading\n\n## Next Ingest Suggestions\n- `raw/papers/rag-survey.md` — RAG foundations\n- `raw/tools/memgpt-paper.md` — OS-style tiered memory\n- `raw/tools/langchain-memory.md` — practical memory patterns",

    "markdown": "---\ntitle: \"Agent\"\ntype: concept\ntags: [ai-agent, llm, autonomous-system]\nsources: [agent, skill]\nlast_updated: 2026-09-09\n---\n\n# Agent\n\nA software system driven by a large language model that autonomously decides which tools to call around a target, observes results, and loops until the task completes or control is yielded.\n\n## Definition\nPer [[agent]] source: Agent 是组织好的 LLM + 工具 + 记忆 + 循环。\n\n## Core Mechanism (from [[agent]])\n1. **Receive goal + context** — translate fuzzy intent into executable target\n2. **Reason next action** — ReAct / Chain-of-Thought pick tool + params\n3. **Execute tool + collect observation** — external executor does the work\n4. **Update state + judge stop** — merge observation, decide done or loop back\n\nA canonical pseudo-code:\n\n```\nwhile not done:\n    thought    = model.reason(goal, history)\n    if thought.is_final_answer: return thought.answer\n    tool_call  = model.choose_tool()\n    observation = execute(tool_call)\n    history.append((thought, tool_call, observation))\n```\n\n## Boundary\n- **Not a chatbot** — must dynamically control flow, not just answer questions\n- **Not a fixed automation script** — steps are auto-determined, not pre-encoded\n- **Not AGI** — bounded by permissions, token budget, stopping condition\n\n## Practical Use\n| Use Agent | Use Script |\n|---|---|\n| Steps cannot be enumerated in advance | Steps are fixed, repeated |\n| Need to adapt based on results | Millisecond-SLA hot paths |\n| Single failures acceptable via retry | Any failure is irreversible |\n\n## See Also\n- [[Skill]] — the packaging unit that turns general models into domain experts\n- [[LLMContext]] — Agent operations constrained by context window\n- [[ProgressiveDisclosure]] — load-on-demand that lets Agents use Skills within bounded context\n- [[ReAct]] — reasoning pattern used in Agent's step 2\n- [[Anthropic]] / [[OpenAI]] — primary vendors shaping Agent design vocabulary",

    "markdown": "---\ntitle: \"LLM Context\"\ntype: concept\ntags: [llm, context-window, transformer]\nsources: [llm-context]\nlast_updated: 2026-09-09\n---\n\n# LLM Context\n\nThe maximum number of tokens the model can simultaneously read and reference in a single inference pass.\n\n## Definition\nPer [[llm-context]] source: Sizing unit is **token** (BPE sub-word), not character.\n- English: ~1 token / word\n- Chinese: ~1.5–2 tokens / character\n\nThe window includes: system prompt + history + retrieved docs + reserved output, and must satisfy `total ≤ N tokens`.\n\n## Core Mechanism\n1. **BPE tokenization** — uniform processing across languages and out-of-vocab words\n2. **Positional encoding + self-attention** — O(n²) cost scaling (1000 → 1M relations, 10000 → 100M)\n3. **Truncation policy** — most APIs silently truncate oldest content rather than raising\n4. **Attention bias** — strong at start (system) + end (current); middle weakened (\"Lost in the Middle\")\n\n## Boundary\n- **Not = training knowledge** — parameters (long-term) ≠ context (this session)\n- **Not = bigger is better** — cost and latency scale with size; needs business-case ROI\n- **Not = character count** — use the target model's tokenizer\n\n## Practical Use\n| Use Large Window | Use RAG / Summary |\n|---|---|\n| Full-document cross-section QA | Sparse info, only fragments needed |\n| Long-chain Agent (multi-step state) | High-frequency, low-latency, low-cost |\n| Truncation-sensitive review | Acceptable chunk + merge for summarization |\n\n## See Also\n- [[ContextWindow]] — English-name redirect\n- [[Token]] — fundamental unit\n- [[Agent]] — bounded by context budget\n- [[Skill]] — progressive disclosure extends effective \"memory\"\n- [[Transformer]] — architecture whose n² cost sets the bound",

    "markdown": "---\ntitle: \"AI Agent(智能体)\"\ntype: source\ntags: [concept-learning, ai-agent, llm, silent-madman]\ndate: 2026-09-05\nsource_file: raw/learning-materials/agent.html\nsources: [agent]\nlast_updated: 2026-09-09\n---\n\n## Summary\nA concept-learning HTML document (7-section format: 一句话定义 / 个人解释 / 核心机制 / 应用场景 / 边界辨析 / 来源链接 / 一句话回顾) generated by the silent-madman concept-explainer skill on 2026-09-05. Defines AI Agent as a software system driven by an LLM that autonomously decides which tools to call around a target, observes results, and loops until the task completes or control is yielded.\n\n## Key Claims\n- Agent is not a new algorithm but an *organization* of (reasoning model + tool calls + memory + loop).\n- The core mechanism is a four-step loop: receive goal + context → reason next action → execute tool + collect observation → update state + judge whether to stop.\n- Common misconception: \"attaching a tool makes an Agent\" — Anthropic and OpenAI both require the model to *dynamically* control the execution flow.\n- Practical scoping: use Agents only when steps cannot be enumerated in advance; use scripts otherwise.\n\n## Key Quotes\n> \"Agent 不是某种新算法,而是把『会推理的模型 + 可以调用的工具 + 一个会停下来的循环』组织在一起,让系统能围绕目标自己挑路径。\"\n\n## Connections\n- [[Anthropic]] — primary source for Agent definition and Agent Skills design\n- [[OpenAI]] — complementary view on Agent Skills\n- [[Agent]] — concept page this source primarily informs\n- [[LLMContext]] — Agent operations constrained by context window budget\n- [[Skill]] — Skill is the packaging unit that empowers Agents\n- [[ReAct]] — reasoning pattern used in step 2 of the Agent loop\n\n## Contradictions\n- None detected at ingest time.",

    "markdown": "---\ntitle: \"LLM Context Window(大模型上下文窗口)\"\ntype: source\ntags: [concept-learning, llm, context-window, silent-madman]\ndate: 2026-09-05\nsource_file: raw/learning-materials/llm-context.html\nsources: [llm-context]\nlast_updated: 2026-09-09\n---\n\n## Summary\nA concept-learning HTML document generated by silent-madman's concept-explainer skill on 2026-09-05. Defines the LLM context window as the maximum number of tokens the model can simultaneously read and reference in a single inference pass. The mechanism covers BPE tokenization, positional encoding + self-attention, total length judgment + truncation, and attention-weight shifting (Lost in the Middle).\n\n## Key Claims\n- Context window is the model's \"short-term memory desktop\" — sized in tokens, not characters (Chinese characters average 1.5–2 tokens each).\n- Self-attention cost grows as n²; 1000 tokens → 1M pair-wise relations, 10000 tokens → 100M.\n- Most commercial APIs *silently truncate* on overflow rather than raising an error — explaining the common \"AI amnesia\" experience.\n- \"Lost in the Middle\": even within window, the model attends strongest to system prompt + current question; middle content gets weaker attention.\n\n## Key Quotes\n> \"上下文窗口是模型的『短期记忆』办公桌——尺寸按 token 计算,受注意力平方成本硬约束,决定了模型这一轮能看见什么、记不得什么。\"\n\n## Connections\n- [[Anthropic]] — context-engineering + Skills 三级披露 designed around context window constraints\n- [[LLMContext]] — concept page this source primarily informs\n- [[ContextWindow]] — alternative naming for the same concept\n- [[Token]] — fundamental unit of context accounting\n- [[Agent]] — Agent operations are bounded by context budget\n- [[Transformer]] — underlying architecture whose n² cost sets the window bound\n\n## Contradictions\n- None detected at ingest time.",

    "markdown": "---\ntitle: \"Skill(技能)\"\ntype: source\ntags: [concept-learning, anthropic, skill, progressive-disclosure, silent-madman]\ndate: 2026-09-05\nsource_file: raw/learning-materials/skill.html\nsources: [skill]\nlast_updated: 2026-09-09\n---\n\n## Summary\nA concept-learning HTML document generated by silent-madman's concept-explainer skill on 2026-09-05. Defines Skill as an organized folder of instructions, scripts, and resources that Claude loads on demand when a task is relevant — turning a general model into a domain expert. The core mechanism is *progressive disclosure* (YAML metadata → SKILL.md body → referenced scripts/assets), which fits unlimited expertise into a bounded context window.\n\n## Key Claims\n- Skill is not a prompt template — it is a cross-conversation, version-controlled, multi-product-shared directory.\n- Three-layer progressive disclosure: (1) YAML metadata always in system prompt, (2) SKILL.md body loaded when relevant, (3) scripts/assets loaded on demand.\n- Same Skill folder works across Claude app, Claude Code, API, Agent SDK; released as an open standard after 2025-12.\n- Skill is *not* MCP: Skill teaches the model how to use tools; MCP standardizes the tool connection itself.\n\n## Key Quotes\n> \"Skill 不是『让模型变聪明』,而是『把组织经验打包成可按需加载的目录』,用渐进式披露在有限的上下文里装下无限的专业知识。\"\n\n## Connections\n- [[Anthropic]] — Skill is an Anthropic product feature\n- [[Skill]] — concept page this source primarily informs\n- [[ProgressiveDisclosure]] — the load-on-demand mechanism that makes Skills work\n- [[LLMContext]] — Skills operate within bounded context via progressive disclosure\n- [[Agent]] — Skill is the unit that empowers Agents\n- [[MCP]] — complementary tool-connection standard\n\n## Contradictions\n- None detected at ingest time.",

    "confidence": 1.0,
    "title": "",
    "label": ""
  },
  {
    "id": "sources/llm-context->sources/agent:EXTRACTED",
    "from": "sources/llm-context",
    "to": "sources/agent",
    "type": "EXTRACTED",
    "color": "#555555",
    "confidence": 1.0,
    "title": "",
    "label": ""
  },
  {
    "id": "sources/llm-context->entities/Anthropic:EXTRACTED",
    "from": "sources/llm-context",
    "to": "entities/Anthropic",
    "type": "EXTRACTED",
    "color": "#555555",
    "confidence": 1.0,
    "title": "",
    "label": ""
  },
  {
    "id": "sources/llm-context->concepts/ContextWindow:EXTRACTED",
    "from": "sources/llm-context",
    "to": "concepts/ContextWindow",
    "type": "EXTRACTED",
    "color": "#555555",
    "confidence": 1.0,
    "title": "",
    "label": ""
  }
].map(edge => ({
  ...edge,
  id: edge.id || `${edge.from}->${edge.to}:${edge.type || "INFERRED"}`,
}));
const nodes = new vis.DataSet(originalNodes);
const edges = new vis.DataSet(originalEdges);
const adjacency = new Map();
const searchInput = document.getElementById("search");
const stats = document.getElementById("stats");
const controls = {
  extracted: document.getElementById("cb-extracted"),
  inferred: document.getElementById("cb-inferred"),
  ambiguous: document.getElementById("cb-ambiguous"),
  confSlider: document.getElementById("conf-slider"),
  confValue: document.getElementById("conf-val"),
};
const nodeMap = new Map(originalNodes.map(node => [node.id, node]));
let activeNodeId = null;

function hexToRgba(color, alpha) {
  if (!color) return `rgba(255, 255, 255, ${alpha})`;
  const normalized = color.replace("#", "");
  const value = normalized.length === 3
    ? normalized.split("").map(ch => ch + ch).join("")
    : normalized;
  const intValue = Number.parseInt(value, 16);
  const r = (intValue >> 16) & 255;
  const g = (intValue >> 8) & 255;
  const b = intValue & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function escapeHtml(text) {
  return (text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function stripFrontmatter(markdown) {
  return (markdown || "").replace(/^---\n[\s\S]*?\n---\n?/, "");
}

function renderInlineMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink">[[$1]]</span>');
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return html;
}

function renderMarkdown(markdown) {
  const lines = stripFrontmatter(markdown).split(/\r?\n/);
  const html = [];
  let paragraph = [];
  let listType = null;
  let listItems = [];
  let quoteLines = [];
  let inCodeBlock = false;
  let codeLines = [];

  function flushParagraph() {
    if (!paragraph.length) return;
    html.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
    paragraph = [];
  }

  function flushList() {
    if (!listType || !listItems.length) return;
    const items = listItems.map(item => `<li>${renderInlineMarkdown(item)}</li>`).join("");
    html.push(`<${listType}>${items}</${listType}>`);
    listType = null;
    listItems = [];
  }

  function flushQuote() {
    if (!quoteLines.length) return;
    html.push(`<blockquote>${quoteLines.map(line => renderInlineMarkdown(line)).join("<br>")}</blockquote>`);
    quoteLines = [];
  }

  function flushCode() {
    if (!codeLines.length) {
      html.push("<pre><code></code></pre>");
      return;
    }
    html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
    codeLines = [];
  }

  for (const rawLine of lines) {
    const line = rawLine.replace(/\t/g, "    ");
    const trimmed = line.trim();

    if (trimmed.startsWith("```")) {
      flushParagraph();
      flushList();
      flushQuote();
      if (inCodeBlock) {
        flushCode();
        inCodeBlock = false;
      } else {
        inCodeBlock = true;
      }
      continue;
    }

    if (inCodeBlock) {
      codeLines.push(rawLine);
      continue;
    }

    if (!trimmed) {
      flushParagraph();
      flushList();
      flushQuote();
      continue;
    }

    const headingMatch = trimmed.match(/^(#(1, 6))\s+(.+)$/);
    if (headingMatch) {
      flushParagraph();
      flushList();
      flushQuote();
      const level = headingMatch[1].length;
      html.push(`<h${level}>${renderInlineMarkdown(headingMatch[2])}</h${level}>`);
      continue;
    }

    if (/^(-(3,)|\*(3,))$/.test(trimmed)) {
      flushParagraph();
      flushList();
      flushQuote();
      html.push("<hr>");
      continue;
    }

    const quoteMatch = trimmed.match(/^>\s?(.*)$/);
    if (quoteMatch) {
      flushParagraph();
      flushList();
      quoteLines.push(quoteMatch[1]);
      continue;
    }
    flushQuote();

    const unorderedMatch = trimmed.match(/^[-*]\s+(.+)$/);
    if (unorderedMatch) {
      flushParagraph();
      if (listType && listType !== "ul") flushList();
      listType = "ul";
      listItems.push(unorderedMatch[1]);
      continue;
    }

    const orderedMatch = trimmed.match(/^\d+\.\s+(.+)$/);
    if (orderedMatch) {
      flushParagraph();
      if (listType && listType !== "ol") flushList();
      listType = "ol";
      listItems.push(orderedMatch[1]);
      continue;
    }

    flushList();
    paragraph.push(trimmed);
  }

  if (inCodeBlock) flushCode();
  flushParagraph();
  flushList();
  flushQuote();
  return html.join("");
}

function rebuildAdjacency(filteredEdges) {
  adjacency.clear();
  for (const node of originalNodes) {
    adjacency.set(node.id, new Set());
  }
  for (const edge of filteredEdges) {
    if (!adjacency.has(edge.from)) adjacency.set(edge.from, new Set());
    if (!adjacency.has(edge.to)) adjacency.set(edge.to, new Set());
    adjacency.get(edge.from).add(edge.to);
    adjacency.get(edge.to).add(edge.from);
  }
}

function currentEdgeState() {
  const minConf = parseInt(controls.confSlider.value, 10) / 100;
  controls.confValue.textContent = minConf.toFixed(2);
  return {
    showExtracted: controls.extracted.checked,
    showInferred: controls.inferred.checked,
    showAmbiguous: controls.ambiguous.checked,
    minConf,
  };
}

function passesEdgeFilters(edge, edgeState) {
  const typeOk = (edge.type === "EXTRACTED" && edgeState.showExtracted)
    || (edge.type === "INFERRED" && edgeState.showInferred)
    || (edge.type === "AMBIGUOUS" && edgeState.showAmbiguous);
  const confOk = (edge.confidence ?? 1.0) >= edgeState.minConf;
  return typeOk && confOk;
}

function searchNodes(q) {
  applyFilters(q, activeNodeId);
}

function clearSelection() {
  activeNodeId = null;
  closeDrawer();
  applyFilters(searchInput.value, null);
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
}

function openDrawer(node, relatedIds) {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer-title").textContent = node.label;
  const communityText = Number.isInteger(node.group) && node.group >= 0 ? ` · community ${node.group}` : "";
  document.getElementById("drawer-meta").textContent = `${node.type}${communityText}`;
  document.getElementById("drawer-path").textContent = node.path;
  document.getElementById("drawer-preview").textContent = node.preview || "";
  document.getElementById("drawer-markdown").innerHTML = renderMarkdown(node.markdown || "");

  const relatedList = document.getElementById("drawer-related-list");
  relatedList.innerHTML = "";
  const relatedNodes = originalNodes
    .filter(item => relatedIds.has(item.id) && item.id !== node.id)
    .sort((a, b) => a.label.localeCompare(b.label));

  if (relatedNodes.length === 0) {
    const empty = document.createElement("span");
    empty.textContent = "No directly connected nodes";
    relatedList.appendChild(empty);
    return;
  }

  for (const related of relatedNodes) {
    const chip = document.createElement("button");
    chip.className = "related-chip";
    chip.textContent = related.label;
    chip.onclick = () => focusNode(related.id);
    relatedList.appendChild(chip);
  }
}

function applyFilters(query = searchInput.value, selectedNodeId = activeNodeId) {
  const lower = (query || "").trim().toLowerCase();
  const edgeState = currentEdgeState();
  const filteredEdges = originalEdges.filter(edge => passesEdgeFilters(edge, edgeState));
  rebuildAdjacency(filteredEdges);

  const relatedIds = selectedNodeId
    ? new Set([selectedNodeId, ...(adjacency.get(selectedNodeId) || [])])
    : null;
  const filteredNodeIds = new Set();
  for (const edge of filteredEdges) {
    filteredNodeIds.add(edge.from);
    filteredNodeIds.add(edge.to);
  }

  let visibleNodeCount = 0;
  const nodeUpdates = originalNodes.map(node => {
    const matchesSearch = !lower || node.label.toLowerCase().includes(lower);
    const isActive = selectedNodeId === node.id;
    const isConnected = filteredNodeIds.has(node.id);
    const isRelated = !relatedIds || relatedIds.has(node.id);
    const hidden = !selectedNodeId && !lower && !isConnected;
    const emphasized = matchesSearch && isRelated && (isConnected || !!lower || isActive);

    if (!hidden) {
      visibleNodeCount += 1;
    }

    return {
      id: node.id,
      hidden,
      color: {
        background: emphasized ? node.color : hexToRgba(node.color, hidden ? 0.05 : 0.14),
        border: emphasized ? hexToRgba(node.color, 0.96) : hexToRgba(node.color, hidden ? 0.08 : 0.22),
        highlight: { background: node.color, border: hexToRgba(node.color, 1) },
        hover: { background: node.color, border: hexToRgba(node.color, 1) },
      },
      font: {
        color: emphasized ? "#f2f3f8" : hidden ? "rgba(242,243,248,0.08)" : "rgba(242,243,248,0.2)",
      },
      borderWidth: isActive ? 5 : 2,
      size: isActive ? 18 : 12,
    };
  });

  const edgeUpdates = originalEdges.map(edge => {
    const enabled = passesEdgeFilters(edge, edgeState);
    if (!enabled) {
      return { id: edge.id, hidden: true };
    }

    const matchesSearch = !lower
      || nodeMap.get(edge.from)?.label.toLowerCase().includes(lower)
      || nodeMap.get(edge.to)?.label.toLowerCase().includes(lower);
    const isRelated = !relatedIds || relatedIds.has(edge.from) || relatedIds.has(edge.to);
    const touchesActive = !!selectedNodeId && (edge.from === selectedNodeId || edge.to === selectedNodeId);
    const emphasized = matchesSearch && isRelated;

    return {
      id: edge.id,
      hidden: false,
      width: touchesActive ? 2.8 : emphasized ? 1.2 : 0.6,
      color: emphasized ? edge.color : hexToRgba(edge.color, 0.08),
    };
  });

  nodes.update(nodeUpdates);
  edges.update(edgeUpdates);

  if (selectedNodeId) {
    const activeNode = nodeMap.get(selectedNodeId);
    if (activeNode) {
      openDrawer(activeNode, relatedIds || new Set([selectedNodeId]));
    }
  }

  const focusSuffix = selectedNodeId && nodeMap.get(selectedNodeId)
    ? ` · focused: ${nodeMap.get(selectedNodeId).label}`
    : "";
  stats.textContent = `${visibleNodeCount} nodes · ${filteredEdges.length} edges${focusSuffix}`;
}

const container = document.getElementById("graph");

// Adaptive physics based on graph size
const nodeCount = originalNodes.length;
const gravConst = nodeCount > 80 ? -8000 : nodeCount > 30 ? -5000 : -2000;
const springLen = nodeCount > 80 ? 250 : nodeCount > 30 ? 200 : 150;

const network = new vis.Network(container, { nodes, edges }, {
  nodes: {
    shape: "dot",
    font: { color: "#ddd", size: 12, strokeWidth: 3, strokeColor: "#111" },
    borderWidth: 1.5,
    scaling: {
      min: 8,
      max: 40,
      label: { enabled: true, min: 10, max: 20, drawThreshold: 6, maxVisible: 24 },
    },
  },
  edges: {
    width: 0.8,
    smooth: { type: "continuous" },
    arrows: { to: { enabled: true, scaleFactor: 0.4 } },
    color: { inherit: false },
    hoverWidth: 2,
  },
  physics: {
    stabilization: { iterations: 250, updateInterval: 25, fit: true },
    barnesHut: { gravitationalConstant: gravConst, springLength: springLen, springConstant: 0.02, damping: 0.15 },
    minVelocity: 0.75,
  },
  interaction: { hover: true, tooltipDelay: 150, hideEdgesOnDrag: true, hideEdgesOnZoom: true },
});

// Ensure the graph fits the viewport after physics stabilization
network.once("stabilizationIterationsDone", function () {
  network.fit({ animation: { duration: 400, easingFunction: "easeInOutQuad" } });
});

function focusNode(nodeId) {
  activeNodeId = nodeId;
  applyFilters(searchInput.value, nodeId);
  const node = nodeMap.get(nodeId) || nodes.get(nodeId);
  const relatedIds = new Set([nodeId, ...(adjacency.get(nodeId) || [])]);
  openDrawer(node, relatedIds);
  network.focus(nodeId, {
    scale: 1.1,
    animation: { duration: 300, easingFunction: "easeInOutQuad" },
  });
}

network.on("click", params => {
  if (params.nodes.length > 0) {
    focusNode(params.nodes[0]);
  } else {
    clearSelection();
  }
});

applyFilters();
</script>
</body>
